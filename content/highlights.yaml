# Highlights tour (?tour=highlights): fifteen key moments, about five minutes at reading speed.
#
# scene/at: where the strip stops, at = 0 (left edge of the scene) to 1 (right edge).
# note:     optional id in content/notes.yaml, offered as "read the note" on the stop card.
# text:     the stop's narration and caption, own words, 40-70 words.
# sources:  keys in content/sources.yaml backing the facts in the text.
# Every text starts as review_status: unreviewed / lang_review: draft (Paul reviews).

- id: edward
  scene: 1
  at: 0.5
  title: {fr: Un roi sans héritier, en: A king without an heir}
  text:
    fr: >-
      Tout part d'une question : qui succédera au roi Édouard, âgé et sans enfant ? Ici, il parle à
      Harold, le plus puissant comte d'Angleterre. La broderie ne dit pas ce qu'il lui confie. Les
      chroniqueurs normands, eux, répondent : il l'envoie confirmer à Guillaume de Normandie la promesse
      de la couronne.
    en: >-
      Everything starts with one question: who will succeed King Edward, old and childless? Here he
      speaks to Harold, the most powerful earl in England. The embroidery does not say what he tells
      him. The Norman chroniclers do: he is sending Harold to confirm the promise of the crown to
      William of Normandy.
  sources: [tituli, poitiers, musset]
  review_status: unreviewed
  lang_review: draft

- id: sailing
  scene: 4
  at: 0.5
  title: {fr: Harold prend la mer, en: Harold puts to sea}
  text:
    fr: >-
      Harold embarque avec ses chiens et son faucon, comme un grand seigneur en voyage. Regardez les
      navires : coques à clins, voile carrée, proue et poupe relevées, dans la tradition scandinave. Le
      vent le pousse vers la côte du Ponthieu, loin de là où il pensait aborder.
    en: >-
      Harold sets sail with his hounds and his hawk, like a great lord on a journey. Look at the ships:
      overlapping planks, a square sail, raised prow and stern, in the Scandinavian tradition. The wind
      carries him to the coast of Ponthieu, far from where he meant to land.
  note: harold-journey-map
  sources: [tituli, wilson, poitiers]
  review_status: unreviewed
  lang_review: draft

- id: captured
  scene: 7
  at: 0.5
  title: {fr: Capturé à l'arrivée, en: Seized on landing}
  text:
    fr: >-
      À peine débarqué, Harold est arrêté par Guy, comte de Ponthieu. Un voyageur de haut rang jeté sur
      vos côtes valait une rançon. Guillaume exigera qu'on le lui remette : l'Anglais devient l'hôte, et
      l'obligé, du duc de Normandie.
    en: >-
      No sooner has he landed than Harold is arrested by Guy, count of Ponthieu. A high-ranking
      traveller washed up on your shore was worth a ransom. William will demand that he be handed over:
      the Englishman becomes the guest, and the debtor, of the duke of Normandy.
  sources: [tituli, poitiers, morris]
  review_status: unreviewed
  lang_review: draft

- id: aelfgyva
  scene: 15
  at: 0.5
  title: {fr: L'énigme d'Ælfgyva, en: The Ælfgyva riddle}
  text:
    fr: >-
      La scène la plus mystérieuse de la broderie : une femme nommée Ælfgyva, un clerc qui lui touche le
      visage, une phrase sans verbe. Dans la bordure, une figure nue imite le geste. Les spectateurs de
      l'époque connaissaient sans doute l'histoire ; nous l'avons perdue.
    en: >-
      The most mysterious scene in the embroidery: a woman named Ælfgyva, a cleric touching her face, a
      sentence with no verb. In the border below, a naked figure copies the gesture. Viewers at the time
      probably knew the story; we have lost it.
  note: aelfgyva
  sources: [tituli, musset, pastan_white]
  review_status: unreviewed
  lang_review: draft

- id: quicksand
  scene: 17
  at: 0.5
  title: {fr: Les sables du Couesnon, en: The Couesnon quicksand}
  text:
    fr: >-
      En route vers la Bretagne, l'armée passe au pied du Mont-Saint-Michel. Dans les sables mouvants du
      Couesnon, des soldats s'enlisent ; Harold en sauve deux, l'un sur son dos, l'autre par la main. Le
      récit normand rend ici hommage au courage de l'Anglais.
    en: >-
      On the way to Brittany the army passes below Mont-Saint-Michel. In the quicksand of the Couesnon
      soldiers sink; Harold saves two of them, one on his back, the other by the hand. Here the Norman
      story pays tribute to the Englishman's courage.
  sources: [tituli, poitiers, musset]
  review_status: unreviewed
  lang_review: draft

- id: oath
  scene: 23
  at: 0.48
  title: {fr: Le serment, en: The oath}
  text:
    fr: >-
      Le cœur du récit. Les mains posées sur deux reliquaires, Harold prête serment devant Guillaume.
      Ce qu'il jure, la broderie ne le dit pas. Pour les Normands, il promet de soutenir Guillaume ;
      en prenant la couronne, il deviendra parjure.
    en: >-
      The heart of the story. With his hands on two reliquaries, Harold swears an oath before William.
      What he swears, the embroidery does not say. To the Normans he promises to support William; by
      taking the crown he will become an oath-breaker.
  note: oath
  sources: [tituli, poitiers, eadmer, bates]
  review_status: unreviewed
  lang_review: draft

- id: edward-dies
  scene: 27
  at: 0.5
  title: {fr: "La mort d'Édouard, racontée à rebours", en: "Edward's death, told backwards"}
  text:
    fr: >-
      Les funérailles d'Édouard viennent avant sa mort : la broderie remonte le temps. Au centre, le
      roi mourant parle à ses fidèles. Selon la Vie du roi Édouard, il confie le royaume à la protection
      d'Harold. Confié, ou légué ? Tout le débat est là.
    en: >-
      Edward's funeral comes before his death: the embroidery steps back in time. At the centre the
      dying king speaks to those around him. According to the Life of King Edward, he commends the
      kingdom to Harold's protection. Entrusted, or bequeathed? That is the whole debate.
  note: funeral-first
  sources: [tituli, vita, asc, wilson]
  review_status: unreviewed
  lang_review: draft

- id: crowned
  scene: 30
  at: 0.5
  title: {fr: Harold roi, en: Harold crowned}
  text:
    fr: >-
      Harold trône, couronne en tête, sceptre et globe en main. Selon la Chronique anglo-saxonne, il est
      sacré le 6 janvier 1066, le jour même de l'inhumation d'Édouard. À côté se tient l'archevêque
      Stigand, un choix d'image qui fait douter de la régularité du sacre.
    en: >-
      Harold sits enthroned, crowned, holding sceptre and orb. According to the Anglo-Saxon Chronicle
      he was consecrated on 6 January 1066, the very day of Edward's burial. Beside him stands
      Archbishop Stigand, a choice of picture that casts doubt on the coronation.
  note: who-crowned
  sources: [tituli, asc, john_worcester]
  review_status: unreviewed
  lang_review: draft

- id: comet
  scene: 32
  at: 0.665
  title: {fr: La comète, en: The comet}
  text:
    fr: >-
      Des hommes lèvent les yeux vers une « étoile » chevelue : la comète de Halley, visible au
      printemps 1066. Pour tous, c'est un présage. Juste après, sous Harold inquiet, des navires
      fantômes se dessinent dans la bordure, comme une annonce de l'invasion.
    en: >-
      Men look up at a "star" with streaming hair: Halley's comet, seen in the spring of 1066. To
      everyone it was an omen. Just after, beneath a worried Harold, ghostly ships appear in the border,
      as if announcing the invasion.
  note: comet
  sources: [tituli, asc, esa_comet, wilson]
  review_status: unreviewed
  lang_review: draft

- id: fleet
  scene: 35
  at: 0.6
  title: {fr: Une flotte en quelques mois, en: A fleet in a few months}
  text:
    fr: >-
      Guillaume ordonne de construire une flotte. Bûcherons et charpentiers abattent, équarrissent,
      assemblent : la broderie détaille chaque outil, la hache, l'herminette, la tarière. En quelques
      mois, il faut des centaines de navires pour porter hommes et chevaux.
    en: >-
      William orders a fleet to be built. Woodcutters and shipwrights fell, square and assemble: the
      embroidery details every tool, the axe, the adze, the auger. In a few months hundreds of ships are
      needed to carry men and horses.
  note: shipbuilding
  sources: [tituli, wilson, poitiers, lewis2008]
  review_status: unreviewed
  lang_review: draft

- id: crossing
  scene: 38
  at: 0.5
  title: {fr: La traversée, en: The crossing}
  text:
    fr: >-
      La flotte traverse de nuit, chevaux à bord. Le navire de Guillaume porte une croix en tête de mât.
      Les Normands débarquent à Pevensey le 28 septembre 1066 sans rencontrer de résistance : Harold est
      dans le nord, où il vient de battre une autre armée d'invasion.
    en: >-
      The fleet crosses by night, horses on board. William's ship carries a cross at the masthead. The
      Normans land at Pevensey on 28 September 1066 unopposed: Harold is in the north, where he has just
      defeated another invading army.
  note: crossing-map
  sources: [tituli, poitiers, asc, bates]
  review_status: unreviewed
  lang_review: draft

- id: meal
  scene: 43
  at: 0.5
  title: {fr: Le repas béni, en: The blessed meal}
  text:
    fr: >-
      Autour d'une table en demi-lune, l'évêque Odon bénit le repas. La composition rappelle les images
      de la Cène : la conquête est placée sous la protection de Dieu. Odon, demi-frère de Guillaume et
      évêque de Bayeux, est sans doute le commanditaire de la broderie.
    en: >-
      Around a half-moon table, Bishop Odo blesses the meal. The layout recalls pictures of the Last
      Supper: the conquest is placed under God's protection. Odo, William's half-brother and bishop of
      Bayeux, probably commissioned the embroidery.
  note: odos-men
  sources: [tituli, wilson, newapproaches, musset]
  review_status: unreviewed
  lang_review: draft

- id: william-alive
  scene: 55
  at: 0.5
  title: {fr: « Je suis vivant », en: '"I am alive"'}
  text:
    fr: >-
      La rumeur court que Guillaume est mort. Il relève son casque pour montrer son visage, tandis
      qu'Eustache de Boulogne le désigne de sa bannière. Guillaume de Poitiers raconte la même scène :
      c'est ainsi que le duc arrêta la panique.
    en: >-
      A rumour spreads that William is dead. He pushes up his helmet to show his face, while Eustace of
      Boulogne points to him with his banner. William of Poitiers tells the same story: this is how the
      duke stopped the panic.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- id: harold-killed
  scene: 57
  at: 0.58
  title: {fr: La mort d'Harold, en: Harold's death}
  text:
    fr: >-
      Harold est tué. Mais lequel est-il : l'homme qui saisit une flèche près de son œil, ou celui
      qu'abat l'épée d'un cavalier ? La « flèche dans l'œil » doit peut-être beaucoup aux restaurateurs.
      L'image la plus célèbre de la broderie reste une enquête ouverte.
    en: >-
      Harold is killed. But which one is he: the man clutching an arrow near his eye, or the one cut down
      by a horseman's sword? The "arrow in the eye" may owe a good deal to the restorers. The most famous
      image in the embroidery is still an open case.
  note: harold-death
  sources: [tituli, brooks_walker, foys, carmen]
  review_status: unreviewed
  lang_review: draft

- id: lost-end
  scene: 58
  at: 0.6
  title: {fr: Une fin perdue, en: A lost ending}
  text:
    fr: >-
      Les Anglais fuient, poursuivis par les cavaliers. Puis la broderie s'interrompt : la fin est
      perdue. On imagine souvent une dernière scène, Guillaume couronné à Noël 1066. Nous ne la verrons
      jamais. Mais l'histoire de la broderie, elle, ne fait que commencer.
    en: >-
      The English flee, chased by the horsemen. Then the embroidery breaks off: the end is lost. A final
      scene is often imagined, William crowned at Christmas 1066. We will never see it. But the story of
      the embroidery itself is only beginning.
  note: lost-end
  sources: [tituli, musset, hicks]
  review_status: unreviewed
  lang_review: draft
