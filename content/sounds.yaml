# Recorded sounds for the soundscape, all CC0 (no rights reserved) from OpenGameArt.org; credited in About anyway.
# scripts/make_sounds.py downloads each source, cuts and loops it, and writes public/audio/sfx/<id>.mp3.
#
# url:    the file as published on the page (page: the OpenGameArt page, for the credit and licence)
# cut:    [start, duration] in seconds; loop: true makes a seamless loop (crossfaded end into start)
# hits:   start times of single sounds to keep (each `hit` seconds long), laid out every `every` seconds in one
#         file (a sprite), so the app can play them one at a time in any rhythm

hooves:
  title: Horse Trotting
  author: EZduzziteh
  page: https://opengameart.org/content/horse-trotting
  url: https://opengameart.org/sites/default/files/Trot.ogg
  hits: [1.10, 8.674, 3.874, 2.723, 11.10, 4.456]
  hit: 0.13
  every: 0.25
  licence: CC0

barks:
  title: Dog barking mono
  author: HaelDB
  page: https://opengameart.org/content/dog-barking-mono
  url: https://opengameart.org/sites/default/files/dog_barking_mono.wav
  cut: [0, 2.0]
  licence: CC0

