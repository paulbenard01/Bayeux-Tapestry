# The soundscape under each scene (src/soundscape.ts). Two parts, as in a film score:
#
# mood:   the ethereal hum, slow airy chords that change with the story: calm, journey, sea, omen, solemn,
#         elegy, tension, battle. It always plays (while the sound is on) and moves from mood to mood.
# layers: quiet background effects, weights 0-1. sea (generated swell, with recorded washes), ships (timbers
#         creaking), wind, birds, gulls, hawk (Harold's hawk, a rare cry), horses (with gait: walk | trot |
#         gallop; now and then a snort or a neigh), hounds (barks), workshop (axes, hammers, anvil), feast (a
#         banquet hall), fire, battle (a distant battle).
#         bells (the funeral's handbells), chant (plainchant, a public-domain recording).
# cue:    a one-off sound on arrival: horn (a distant call to arms), divine (a sacred shimmer).
# space:  where the scene takes place, for the effects' reverb: open (the default), hall, church.
#
# Every scene in view adds its layers, panned to its side of the view and fainter towards the edges.
#
# Recorded effects come from content/sounds.yaml (CC0), generated ones from scripts/make_sfx.mjs. Effects stay
# under the hum.

