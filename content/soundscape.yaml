# The soundscape: which sounds play under each scene, from what the scene shows. As the reader moves along the
# embroidery the sounds of the scene at the centre fade in and the others fade out (src/soundscape.ts).
#
# Layers: court (a low drone), sea, wind (sails), horses (hooves), hounds (barking), workshop (axes and
# hammers), feast (voices, cups), church (a slow chord), funeral (a darker chord and a bell), battle (shouts,
# clashes, drums). Weights from 0 to 1. All sounds are generated in the browser; no recording is used.

