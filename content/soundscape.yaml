# The soundscape under each scene (src/soundscape.ts). Two parts, as in a film score:
#
# mood:   the ethereal hum, slow airy chords that change with the story: calm, journey, sea, omen, solemn,
#         elegy, tension, battle. It always plays (while the sound is on) and moves from mood to mood.
# layers: quiet background effects, weights 0-1. sea (generated swell, with recorded washes), wind, birds,
#         gulls, horses (with gait: walk | trot | gallop), hounds, workshop (axes, hammers, anvil), feast
#         (a murmur of voices), fire, battle (a distant crowd and clashing blades).
#
# Recorded effects come from content/sounds.yaml (CC0). Effects stay well under the hum.

