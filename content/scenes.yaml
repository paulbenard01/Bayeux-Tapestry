# The 58 scenes of the Bayeux Tapestry, in the numbering inked on the backing cloth around 1800
# and still used by the Bayeux Museum (Musset 2002).
#
# latin:   the titulus as embroidered; [brackets] expand abbreviations.
# gloss:   our own translation of the titulus.
# title:   a short heading for menus.
# script:  the narration I read aloud; also the on-screen captions. Own words.
# sources: keys in content/sources.yaml backing the facts in the script.
#
# Every text starts as review_status: unreviewed / lang_review: draft (Paul reviews).

- n: 1
  latin: EDWARD[US] REX
  gloss: {fr: Le roi Édouard, en: King Edward}
  title: {fr: Le roi Édouard, en: King Edward}
  script:
    fr: >-
      Tout commence dans un palais anglais. Le vieux roi Édouard le Confesseur, sans enfant, parle à
      deux hommes ; l'un d'eux est sans doute Harold, le plus puissant comte du royaume. Que lui dit-il ?
      La broderie se tait. Les chroniqueurs normands, eux, affirment qu'Édouard l'envoie confirmer à
      Guillaume de Normandie la promesse de la couronne.
    en: >-
      It all begins in an English palace. The old, childless king, Edward the Confessor, talks with two
      men; one is probably Harold, the most powerful earl in the kingdom. What is he telling him? The
      embroidery keeps silent. The Norman chroniclers do not: Edward, they say, is sending Harold to
      confirm the promise of the crown to William of Normandy.
  sources: [tituli, poitiers, musset]
  review_status: unreviewed
  lang_review: draft

- n: 2
  latin: UBI HAROLD DUX ANGLORUM ET SUI MILITES EQUITANT AD BOSHAM
  gloss:
    fr: Où Harold, chef des Anglais, et ses hommes chevauchent vers Bosham
    en: Where Harold, leader of the English, and his men ride to Bosham
  title: {fr: Chevauchée vers Bosham, en: The ride to Bosham}
  place: Bosham
  script:
    fr: >-
      Harold part à cheval, faucon au poing, ses chiens courant devant lui : l'image d'un grand
      seigneur en voyage, pas d'un homme en mission secrète. Il se rend à Bosham, sur la côte du Sussex,
      un domaine de sa famille, les Godwin.
    en: >-
      Harold rides out with a hawk on his wrist and his hounds running ahead: the picture of a great
      lord travelling, not of a man on a secret errand. He is heading for Bosham, on the Sussex coast,
      an estate of his family, the Godwins.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 3
  latin: ECCLESIA[M]
  gloss: {fr: (vers) l'église, en: (to) the church}
  title: {fr: Prière et banquet à Bosham, en: Prayer and feast at Bosham}
  place: Bosham
  script:
    fr: >-
      À Bosham, deux hommes entrent à l'église pour prier avant la traversée. Puis on festoie à l'étage
      d'une grande salle, cornes à boire levées, jusqu'à ce qu'un homme, sur l'escalier, annonce que
      le bateau est prêt.
    en: >-
      At Bosham two men enter the church to pray before the crossing. Then comes a feast in an upstairs
      hall, drinking horns raised, until a man on the stairs calls them down: the ship is ready.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 4
  latin: HIC HAROLD MARE NAVIGAVIT
  gloss: {fr: Ici Harold a pris la mer, en: Here Harold sailed the sea}
  title: {fr: L'embarquement, en: Setting sail}
  script:
    fr: >-
      Les hommes relèvent leurs tuniques et entrent dans l'eau, chiens et faucon dans les bras, pour
      gagner les navires. Regardez les coques : ce sont des bateaux de tradition scandinave, à voile
      carrée, avec une proue et une poupe relevées.
    en: >-
      The men hitch up their tunics and wade out, carrying the hounds and the hawk, to reach the ships.
      Look at the hulls: these are boats in the Scandinavian tradition, with a square sail and a raised
      prow and stern.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 5
  latin: ET VELIS VENTO PLENIS VENIT IN TERRA WIDONIS COMITIS
  gloss:
    fr: Et, voiles gonflées par le vent, il arriva sur la terre du comte Guy
    en: And with sails full of wind he came to the land of Count Guy
  title: {fr: Arrivée en Ponthieu, en: Landing in Ponthieu}
  place: Ponthieu
  script:
    fr: >-
      La traversée ne mène pas en Normandie. Harold aborde en Ponthieu, à l'embouchure de la Somme,
      sur les terres du comte Guy. A-t-il été dévié par le vent, ou est-ce là qu'il voulait aller ? Les
      sources ne s'accordent pas.
    en: >-
      The crossing does not end in Normandy. Harold lands in Ponthieu, near the mouth of the Somme, on
      the lands of Count Guy. Was he blown off course, or did he mean to land here? The sources do not
      agree.
  sources: [tituli, poitiers, morris]
  review_status: unreviewed
  lang_review: draft

- n: 6
  latin: HAROLD
  gloss: {fr: Harold, en: Harold}
  title: {fr: Harold débarque, en: Harold comes ashore}
  place: Ponthieu
  script:
    fr: >-
      Harold met pied à terre, reconnaissable à sa moustache, comme presque tous les Anglais de la
      broderie, alors que les Normands ont la nuque rasée. Un guetteur l'a déjà repéré.
    en: >-
      Harold steps ashore. Like almost every Englishman in the embroidery he wears a moustache, while
      the Normans have the backs of their heads shaved. A lookout has already spotted him.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 7
  latin: HIC APPREHENDIT WIDO HAROLDU[M]
  gloss: {fr: Ici Guy s'empare d'Harold, en: Here Guy seizes Harold}
  title: {fr: Harold capturé, en: Harold seized}
  place: Ponthieu
  script:
    fr: >-
      Le comte Guy arrête Harold à peine débarqué. Au XIᵉ siècle, un naufragé ou un voyageur de haut
      rang pouvait valoir une rançon : le comte de Ponthieu tient là une prise de valeur.
    en: >-
      Count Guy arrests Harold as soon as he lands. In the eleventh century a high-ranking traveller
      cast up on your shore could be worth a ransom: the count of Ponthieu has made a valuable catch.
  sources: [tituli, poitiers, morris]
  review_status: unreviewed
  lang_review: draft

- n: 8
  latin: ET DUXIT EUM AD BELREM ET IBI EUM TENUIT
  gloss:
    fr: Et il le conduisit à Beaurain et l'y retint
    en: And he took him to Beaurain and held him there
  title: {fr: Retenu à Beaurain, en: Held at Beaurain}
  place: Beaurain
  script:
    fr: >-
      Les deux cavaliers chevauchent côte à côte vers Beaurain, une place forte du comte. Harold porte
      toujours son faucon : il reste un noble, même captif.
    en: >-
      The two riders head side by side for Beaurain, one of the count's strongholds. Harold still
      carries his hawk: a captive, but still a nobleman.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 9
  latin: UBI HAROLD ⁊ WIDO PARABOLANT
  gloss: {fr: Où Harold et Guy s'entretiennent, en: Where Harold and Guy talk}
  title: {fr: Harold et Guy, en: Harold and Guy}
  place: Beaurain
  script:
    fr: >-
      Guy, assis, reçoit Harold, debout, l'épée pointée vers le sol. Derrière une colonne, un homme
      écoute. Le signe « ⁊ » de la légende est une abréviation pour « et », très courante dans les
      manuscrits anglais.
    en: >-
      Guy, seated, receives Harold, who stands with his sword pointing down. Behind a column, a man is
      listening. The sign "⁊" in the caption is shorthand for "and", common in English manuscripts.
  sources: [tituli, wilson, newapproaches]
  review_status: unreviewed
  check: >-
    Confirm the figure listening behind the column (Wilson's commentary).
  lang_review: draft

- n: 10
  latin: UBI NUNTII WILLELMI DUCIS VENERUNT AD WIDONE[M] — TUROLD
  gloss:
    fr: Où les messagers du duc Guillaume vinrent trouver Guy — Turold
    en: Where Duke William's messengers came to Guy — Turold
  title: {fr: Les messagers de Guillaume, en: William's messengers}
  place: Beaurain
  script:
    fr: >-
      Les envoyés de Guillaume exigent qu'on leur remette Harold. À côté, un petit homme barbu tient
      leurs chevaux ; la broderie lui donne un nom, Turold. Pourquoi nommer un palefrenier ? Personne
      ne le sait avec certitude.
    en: >-
      William's envoys demand that Harold be handed over. Beside them a small bearded man holds their
      horses, and the embroidery gives him a name: Turold. Why name a groom? Nobody knows for sure.
  sources: [tituli, musset, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 11
  latin: NUNTII WILLELMI
  gloss: {fr: Les messagers de Guillaume, en: William's messengers}
  title: {fr: Au galop, en: At the gallop}
  script:
    fr: >-
      Deux cavaliers lancés au galop, cheveux au vent. Attention : à partir d'ici, l'histoire se lit
      quelques instants de droite à gauche.
    en: >-
      Two riders at full gallop, hair streaming. Careful: from here, for a moment, the story reads from
      right to left.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 12
  latin: HIC VENIT NUNTIUS AD WILGELMUM DUCEM
  gloss: {fr: Ici un messager vient trouver le duc Guillaume, en: Here a messenger comes to Duke William}
  title: {fr: La nouvelle parvient à Guillaume, en: The news reaches William}
  script:
    fr: >-
      Voici, pour la première fois, Guillaume, duc de Normandie, sur son trône. Un messager à moustache,
      donc anglais, lui apprend la capture d'Harold. C'est la cause des scènes précédentes : la
      broderie a montré la conséquence avant la cause.
    en: >-
      Here, for the first time, is William, Duke of Normandy, on his throne. A moustached messenger,
      so an Englishman, brings news of Harold's capture. This is what set off the previous scenes: the
      embroidery has shown the effect before the cause.
  sources: [tituli, wilson, musset]
  review_status: unreviewed
  check: >-
    Confirm the messenger to William is shown with a moustache (English) and the reverse reading of scenes 10-12.
  lang_review: draft

- n: 13
  latin: HIC WIDO ADDUXIT HAROLDUM AD WILGELMUM NORMANNORUM DUCEM
  gloss:
    fr: Ici Guy conduisit Harold à Guillaume, duc des Normands
    en: Here Guy brought Harold to William, Duke of the Normans
  title: {fr: Harold remis à Guillaume, en: Harold handed to William}
  script:
    fr: >-
      Guy livre son prisonnier. D'après Guillaume de Poitiers, l'échange a lieu à Eu, à la frontière de
      la Normandie, et Guy est récompensé. Harold passe d'une captivité à une hospitalité qui l'oblige.
    en: >-
      Guy hands over his prisoner. According to William of Poitiers the exchange took place at Eu, on
      the Norman border, and Guy was rewarded. Harold passes from captivity into a hospitality that
      puts him in William's debt.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 14
  latin: HIC DUX WILGELM[US] CUM HAROLDO VENIT AD PALATIU[M] SUU[M]
  gloss:
    fr: Ici le duc Guillaume vint avec Harold à son palais
    en: Here Duke William came with Harold to his palace
  title: {fr: Au palais du duc, en: At the duke's palace}
  script:
    fr: >-
      Guillaume reçoit Harold dans son palais, probablement à Rouen, la capitale ducale. Harold parle,
      la main tendue ; derrière lui, des hommes en armes. Que négocient-ils ? Les sources normandes et
      anglaises racontent deux histoires différentes.
    en: >-
      William receives Harold in his palace, probably at Rouen, the ducal capital. Harold speaks, hand
      outstretched, with armed men behind him. What are they bargaining over? The Norman and the
      English sources tell two different stories.
  sources: [tituli, poitiers, eadmer]
  review_status: unreviewed
  lang_review: draft

- n: 15
  latin: UBI UNUS CLERICUS ET ÆLFGYVA
  gloss: {fr: Où un clerc et Ælfgyva…, en: Where a cleric and Ælfgyva…}
  title: {fr: L'énigme d'Ælfgyva, en: The Ælfgyva riddle}
  script:
    fr: >-
      Voici la scène la plus mystérieuse de la broderie. Une femme nommée Ælfgyva, un clerc qui lui
      touche le visage, et une phrase sans verbe. Les spectateurs du XIᵉ siècle connaissaient sans
      doute l'histoire ; nous l'avons perdue.
    en: >-
      Here is the most mysterious scene in the embroidery. A woman named Ælfgyva, a cleric touching her
      face, and a sentence with no verb. Eleventh-century viewers probably knew the story; we have lost
      it.
  sources: [tituli, musset, pastan_white]
  review_status: unreviewed
  lang_review: draft

- n: 16
  latin: HIC WILLEM[US] DUX ET EXERCITUS EIUS VENERUNT AD MONTE[M] MICHAELIS
  gloss:
    fr: Ici le duc Guillaume et son armée vinrent au Mont-Saint-Michel
    en: Here Duke William and his army came to Mont Saint-Michel
  title: {fr: Le Mont-Saint-Michel, en: Mont Saint-Michel}
  place: Mont-Saint-Michel
  script:
    fr: >-
      Guillaume part en campagne contre le duc de Bretagne et emmène Harold avec lui. L'armée passe au
      pied du Mont-Saint-Michel, dessiné en quelques traits : l'église au sommet du rocher.
    en: >-
      William goes to war against the Duke of Brittany and takes Harold with him. The army passes below
      Mont Saint-Michel, drawn in a few lines: the church on top of its rock.
  sources: [tituli, poitiers, bates]
  review_status: unreviewed
  lang_review: draft

- n: 17
  latin: ET HIC TRANSIERUNT FLUMEN COSNONIS — HIC HAROLD DUX TRAHEBAT EOS DE ARENA
  gloss:
    fr: Et ici ils traversèrent le Couesnon — Ici Harold les tirait des sables
    en: And here they crossed the river Couesnon — Here Harold dragged them from the sand
  title: {fr: Les sables du Couesnon, en: The Couesnon quicksand}
  place: Couesnon
  script:
    fr: >-
      En traversant le Couesnon, des soldats s'enlisent dans les sables mouvants de la baie. Harold en
      sauve deux, l'un sur le dos, l'autre tiré par la main. La broderie normande rend ici hommage au
      courage de l'Anglais, comme le fait Guillaume de Poitiers.
    en: >-
      Crossing the Couesnon, soldiers sink into the quicksand of the bay. Harold rescues two of them,
      one on his back and one by the hand. Here the Norman story honours the Englishman's courage, as
      William of Poitiers does too.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 18
  latin: ET VENERUNT AD DOL ET CONAN FUGA VERTIT — REDNES
  gloss:
    fr: Et ils vinrent à Dol, et Conan prit la fuite — Rennes
    en: And they came to Dol, and Conan took flight — Rennes
  title: {fr: Dol et Rennes, en: Dol and Rennes}
  place: Dol-de-Bretagne
  script:
    fr: >-
      À Dol, le duc Conan II de Bretagne s'échappe en descendant le long d'une corde depuis son château.
      Plus loin, Rennes est représentée par un château sur sa motte : une ville réduite à son signe.
    en: >-
      At Dol, Duke Conan II of Brittany escapes by sliding down a rope from his castle. Further on,
      Rennes is shown as a castle on its mound: a whole city reduced to a sign.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 19
  latin: HIC MILITES WILLELM[I] DUCIS PUGNANT CONTRA DINANTES
  gloss:
    fr: Ici les chevaliers du duc Guillaume combattent contre les gens de Dinan
    en: Here Duke William's knights fight the men of Dinan
  title: {fr: L'assaut de Dinan, en: The attack on Dinan}
  place: Dinan
  script:
    fr: >-
      Les cavaliers chargent, lance en avant, et deux hommes mettent le feu à la palissade du château
      de Dinan. C'est l'une des plus anciennes images d'un château à motte, cette butte de terre
      couronnée d'une tour de bois.
    en: >-
      The horsemen charge with lances levelled while two men set fire to the palisade of Dinan's castle.
      It is one of the earliest pictures of a motte castle: an earth mound crowned with a wooden tower.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 20
  latin: ET CUNAN CLAVES PORREXIT
  gloss: {fr: Et Conan tendit les clés, en: And Conan handed over the keys}
  title: {fr: Les clés de Dinan, en: The keys of Dinan}
  place: Dinan
  script:
    fr: >-
      Conan se rend : il tend les clés de la ville au bout de sa lance, et Guillaume les reçoit de la
      même façon. Un geste de reddition que tout le monde pouvait comprendre.
    en: >-
      Conan surrenders, passing the keys of the town on the tip of his lance, and William takes them
      the same way. A gesture of surrender anyone could understand.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 21
  latin: HIC WILLELM[US] DEDIT HAROLDO ARMA
  gloss: {fr: Ici Guillaume donna des armes à Harold, en: Here William gave Harold arms}
  title: {fr: Harold reçoit des armes, en: Harold receives arms}
  script:
    fr: >-
      Guillaume remet à Harold un casque et des armes. Pour beaucoup d'historiens, c'est plus qu'un
      cadeau : un geste qui fait d'Harold l'homme de Guillaume, lié à lui par la fidélité.
    en: >-
      William gives Harold a helmet and arms. For many historians this is more than a gift: it is a
      gesture that makes Harold William's man, bound to him by loyalty.
  sources: [tituli, poitiers, bates]
  review_status: unreviewed
  lang_review: draft

- n: 22
  latin: HIC WILLELM[US] VENIT BAGIAS
  gloss: {fr: Ici Guillaume vint à Bayeux, en: Here William came to Bayeux}
  title: {fr: Arrivée à Bayeux, en: Arrival at Bayeux}
  place: Bayeux
  script:
    fr: >-
      Guillaume arrive à Bayeux, la ville où la broderie sera exposée, dans la cathédrale de l'évêque
      Odon, demi-frère du duc. Ce n'est sans doute pas un hasard si la scène suivante, décisive, se
      passe ici.
    en: >-
      William comes to Bayeux, the city where the embroidery would later hang, in the cathedral of
      Bishop Odo, the duke's half-brother. It is probably no accident that the next, decisive scene
      takes place here.
  sources: [tituli, musset, bouet]
  review_status: unreviewed
  lang_review: draft

- n: 23
  latin: UBI HAROLD SACRAMENTUM FECIT WILLELMO DUCI
  gloss: {fr: Où Harold prêta serment au duc Guillaume, en: Where Harold swore an oath to Duke William}
  title: {fr: Le serment, en: The oath}
  place: Bayeux
  script:
    fr: >-
      Le cœur de l'histoire. Harold, les mains posées sur deux reliquaires, prête serment devant
      Guillaume. Ce qu'il a juré, la broderie ne le dit pas. Mais pour les Normands, en prenant la
      couronne, Harold deviendra un parjure.
    en: >-
      The heart of the story. With his hands on two reliquaries, Harold swears an oath before William.
      What he swore, the embroidery does not say. But to the Normans, by taking the crown, Harold will
      become an oath-breaker.
  sources: [tituli, poitiers, eadmer, bates]
  review_status: unreviewed
  lang_review: draft

- n: 24
  latin: HIC HAROLD DUX REVERSUS EST AD ANGLICAM TERRAM
  gloss: {fr: Ici Harold revint en terre anglaise, en: Here Harold returned to England}
  title: {fr: Le retour, en: The return}
  script:
    fr: >-
      Harold rentre en Angleterre. Sur la côte, un guetteur à la fenêtre d'une maison regarde le navire
      approcher, comme si l'on attendait son retour avec inquiétude.
    en: >-
      Harold sails home to England. On the shore a lookout at a window watches the ship come in, as if
      his return were awaited anxiously.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 25
  latin: ET VENIT AD EDWARDU[M] REGEM
  gloss: {fr: Et il vint trouver le roi Édouard, en: And he came to King Edward}
  title: {fr: Devant Édouard, en: Before Edward}
  script:
    fr: >-
      Harold se présente devant Édouard, la tête un peu baissée. Le roi paraît vieilli et lui adresse
      un geste du doigt. Reproche ? Simple accueil ? Chacun lit cette posture selon ce qu'il croit de
      l'histoire.
    en: >-
      Harold comes before Edward, head slightly bowed. The king looks older and points at him. A
      reproach? A simple greeting? Everyone reads this posture according to the story they believe.
  sources: [tituli, wilson, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 26
  latin: HIC PORTATUR CORPUS EADWARDI REGIS AD ECCLESIAM S[AN]C[T]I PETRI AP[OSTO]LI
  gloss:
    fr: Ici le corps du roi Édouard est porté à l'église de saint Pierre apôtre
    en: Here King Edward's body is carried to the church of Saint Peter the Apostle
  title: {fr: Les funérailles d'Édouard, en: Edward's funeral}
  place: Westminster
  script:
    fr: >-
      Le corps d'Édouard est porté à l'église Saint-Pierre, l'abbaye de Westminster qu'il avait fait
      bâtir et qui venait d'être consacrée. Un homme fixe encore un coq sur le toit, et la main de Dieu
      apparaît dans le ciel. Mais attendez : le roi n'est pas encore mort.
    en: >-
      Edward's body is carried to the church of St Peter, the Westminster Abbey he had built, newly
      consecrated. A man is still fixing a weathercock on the roof, and the hand of God reaches down
      from the sky. But wait: the king has not died yet.
  sources: [tituli, vita, asc, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 27
  latin: HIC EADWARDUS REX IN LECTO ALLOQUIT[UR] FIDELES
  gloss:
    fr: Ici le roi Édouard, dans son lit, parle à ses fidèles
    en: Here King Edward, in bed, speaks to his faithful men
  title: {fr: Le lit de mort, en: The deathbed}
  place: Westminster
  script:
    fr: >-
      La broderie revient en arrière. Dans la chambre du haut, Édouard mourant parle à ses proches ;
      un homme tend la main vers lui. Selon la Vie du roi Édouard, il confie alors le royaume à la
      protection d'Harold. Confier, ou donner ? Tout le débat est là.
    en: >-
      The embroidery steps back in time. In the upper room the dying Edward speaks to those around him,
      and one man reaches out to touch his hand. According to the Life of King Edward, he commends the
      kingdom to Harold's protection. Entrusted, or bequeathed? That is the whole debate.
  sources: [tituli, vita, asc, morris]
  review_status: unreviewed
  lang_review: draft

- n: 28
  latin: ET HIC DEFUNCTUS EST
  gloss: {fr: Et ici il mourut, en: And here he died}
  title: {fr: La mort d'Édouard, en: Edward dies}
  place: Westminster
  script:
    fr: >-
      Juste en dessous, on prépare le corps pour l'ensevelir. Édouard meurt le 5 janvier 1066. La mise
      en page, funérailles d'abord, mort ensuite, fait de cette mort le pivot de tout le récit.
    en: >-
      Just below, the body is being prepared for burial. Edward died on 5 January 1066. The layout,
      funeral first and death after, turns his death into the hinge of the whole story.
  sources: [tituli, asc, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 29
  latin: HIC DEDERUNT HAROLDO CORONA[M] REGIS
  gloss: {fr: Ici ils donnèrent à Harold la couronne royale, en: Here they gave Harold the king's crown}
  title: {fr: La couronne offerte, en: The crown offered}
  script:
    fr: >-
      Deux hommes offrent à Harold la couronne et une hache. Notez le « ils » de la légende : qui sont
      ces « ils » ? La broderie laisse planer le doute sur la légitimité de ce choix.
    en: >-
      Two men offer Harold the crown and an axe. Note the "they" in the caption: who are "they"? The
      embroidery leaves the legitimacy of the choice in doubt.
  sources: [tituli, wilson, pastan_white]
  review_status: unreviewed
  lang_review: draft

- n: 30
  latin: HIC RESIDET HAROLD REX ANGLORUM
  gloss: {fr: "Ici siège Harold, roi des Anglais", en: "Here sits Harold, King of the English"}
  title: {fr: Harold roi, en: Harold enthroned}
  place: Westminster
  script:
    fr: >-
      Harold trône, couronné, sceptre et globe en main. D'après la Chronique anglo-saxonne, il est
      sacré dès le 6 janvier 1066, le jour même de l'enterrement d'Édouard. La précipitation dit
      l'urgence : le royaume ne peut pas rester sans roi.
    en: >-
      Harold sits enthroned, crowned, holding sceptre and orb. According to the Anglo-Saxon Chronicle he
      was consecrated on 6 January 1066, the very day of Edward's burial. The haste shows the urgency:
      the kingdom could not be left without a king.
  sources: [tituli, asc]
  review_status: unreviewed
  lang_review: draft

- n: 31
  latin: STIGANT ARCHIEP[ISCOPU]S
  gloss: {fr: L'archevêque Stigand, en: Archbishop Stigand}
  title: {fr: Stigand, en: Stigand}
  script:
    fr: >-
      À côté du roi se tient Stigand, archevêque de Cantorbéry, dont la position était contestée par la
      papauté. Le montrer ici n'est pas neutre : d'autres sources disent qu'Harold fut couronné par
      Ealdred, archevêque d'York.
    en: >-
      Beside the king stands Stigand, Archbishop of Canterbury, whose position the papacy disputed.
      Showing him here is not neutral: other sources say Harold was crowned by Ealdred, Archbishop of
      York.
  sources: [tituli, john_worcester, morris]
  review_status: unreviewed
  lang_review: draft

- n: 32
  latin: ISTI MIRANT[UR] STELLA[M]
  gloss: {fr: Ceux-ci admirent l'étoile, en: These men marvel at the star}
  title: {fr: L'étoile, en: The star}
  script:
    fr: >-
      Des hommes lèvent les yeux vers une « étoile » chevelue : la comète de Halley, qui traverse le
      ciel au printemps 1066. La Chronique anglo-saxonne la voit apparaître le 24 avril et briller une
      semaine. Pour tous, c'est un présage.
    en: >-
      Men look up at a "star" with flowing hair: Halley's comet, which crossed the sky in the spring of
      1066. The Anglo-Saxon Chronicle has it appear on 24 April and shine for a week. To everyone it was
      an omen.
  sources: [tituli, asc, esa_comet]
  review_status: unreviewed
  lang_review: draft

- n: 33
  latin: HAROLD
  gloss: {fr: Harold, en: Harold}
  title: {fr: Harold inquiet, en: Harold uneasy}
  script:
    fr: >-
      Harold, sur son trône, se penche vers un messager. Juste en dessous, dans la bordure, flottent
      des navires sans équipage, à peine esquissés. Beaucoup y voient la flotte que Harold redoute
      déjà.
    en: >-
      Harold, on his throne, leans towards a messenger. Just below, in the border, float empty ships,
      barely outlined. Many see in them the fleet Harold already fears.
  sources: [tituli, wilson, owencrocker2005]
  review_status: unreviewed
  lang_review: draft

- n: 34
  latin: HIC NAVIS ANGLICA VENIT IN TERRAM WILLELMI DUCIS
  gloss:
    fr: Ici un navire anglais vint sur la terre du duc Guillaume
    en: Here an English ship came to Duke William's land
  title: {fr: La nouvelle traverse la mer, en: The news crosses the sea}
  script:
    fr: >-
      Un navire anglais traverse la Manche et apporte en Normandie la nouvelle du couronnement
      d'Harold. La rupture est consommée.
    en: >-
      An English ship crosses the Channel bringing news of Harold's coronation to Normandy. The break
      is complete.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 35
  latin: HIC WILLELM[US] DUX IUSSIT NAVES EDIFICARE
  gloss: {fr: Ici le duc Guillaume ordonna de construire des navires, en: Here Duke William ordered ships to be built}
  title: {fr: Construire une flotte, en: Building a fleet}
  script:
    fr: >-
      Guillaume, conseillé par un homme tonsuré, souvent identifié comme Odon, ordonne de construire
      une flotte. Les bûcherons abattent les arbres, les charpentiers taillent les planches à la hache
      et à l'herminette.
    en: >-
      William, advised by a tonsured man often identified as Odo, orders a fleet to be built.
      Woodcutters fell trees; shipwrights shape planks with axe and adze.
  sources: [tituli, wilson, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 36
  latin: HIC TRAHUNT NAVES AD MARE
  gloss: {fr: Ici on tire les navires vers la mer, en: Here the ships are dragged to the sea}
  title: {fr: À la mer, en: To the sea}
  script:
    fr: >-
      Les navires achevés sont tirés à la corde jusqu'à l'eau. Selon Guillaume de Poitiers, la flotte
      se rassemble à l'embouchure de la Dives au cours de l'été 1066.
    en: >-
      The finished ships are hauled down to the water on ropes. According to William of Poitiers the
      fleet gathered at the mouth of the Dives during the summer of 1066.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 37
  latin: ISTI PORTANT ARMAS AD NAVES ET HIC TRAHUNT CARRUM CUM VINO ET ARMIS
  gloss:
    fr: Ceux-ci portent des armes aux navires, et ici on tire une charrette de vin et d'armes
    en: These men carry arms to the ships, and here they pull a cart of wine and arms
  title: {fr: Armes et vin, en: Arms and wine}
  script:
    fr: >-
      La logistique d'une invasion : des cottes de mailles portées à deux sur une perche, tant elles
      sont lourdes, des casques, des épées, des lances, et une charrette chargée d'un tonneau de vin.
    en: >-
      The logistics of an invasion: mail shirts carried on a pole between two men, so heavy are they,
      helmets, swords, lances, and a cart loaded with a barrel of wine.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 38
  latin: HIC WILLELM[US] DUX IN MAGNO NAVIGIO MARE TRANSIVIT ET VENIT AD PEVENESÆ
  gloss:
    fr: Ici le duc Guillaume traversa la mer sur un grand navire et vint à Pevensey
    en: Here Duke William crossed the sea in a great ship and came to Pevensey
  title: {fr: La traversée, en: The crossing}
  place: Pevensey
  script:
    fr: >-
      La flotte traverse de nuit, chevaux à bord. Le navire de Guillaume porte une croix au sommet du
      mât. Les Normands débarquent à Pevensey, sur la côte du Sussex, le 28 septembre 1066, sans
      rencontrer d'opposition : Harold est alors dans le nord.
    en: >-
      The fleet crosses by night, horses on board. William's ship has a cross at the masthead. The
      Normans land at Pevensey, on the Sussex coast, on 28 September 1066, unopposed: Harold is away in
      the north.
  sources: [tituli, poitiers, asc, bates]
  review_status: unreviewed
  lang_review: draft

- n: 39
  latin: HIC EXEUNT CABALLI DE NAVIBUS
  gloss: {fr: Ici les chevaux sortent des navires, en: Here the horses come out of the ships}
  title: {fr: Le débarquement, en: Landing}
  place: Pevensey
  script:
    fr: >-
      On débarque les chevaux, puis on tire les navires au sec, mâts abattus. La cavalerie normande est
      l'arme décisive de l'expédition ; il a fallu la transporter vivante à travers la Manche.
    en: >-
      The horses are unloaded, then the ships are beached with their masts lowered. The Norman cavalry
      is the decisive weapon of the expedition, and it had to be carried across the Channel alive.
  sources: [tituli, wilson, morris]
  review_status: unreviewed
  lang_review: draft

- n: 40
  latin: ET HIC MILITES FESTINAVERUNT HESTINGA UT CIBUM RAPERENTUR
  gloss:
    fr: Et ici les chevaliers se hâtèrent vers Hastings pour s'emparer de vivres
    en: And here the knights hurried to Hastings to seize food
  title: {fr: Le fourrage, en: Foraging}
  place: Hastings
  script:
    fr: >-
      Les chevaliers filent vers Hastings pour réquisitionner des vivres. Des hommes emportent un mouton,
      un bœuf, un cochon : une armée vit sur le pays qu'elle occupe.
    en: >-
      The knights race to Hastings to requisition food. Men carry off a sheep, an ox, a pig: an army
      lives off the land it occupies.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 41
  latin: HIC EST WADARD
  gloss: {fr: Voici Wadard, en: This is Wadard}
  title: {fr: Wadard, en: Wadard}
  place: Hastings
  script:
    fr: >-
      Un cavalier est nommé : Wadard. Ce n'est pas un grand seigneur ; un homme de ce nom apparaît
      pourtant dans le Domesday Book comme vassal de l'évêque Odon. Un indice de plus que la broderie
      a été faite pour l'entourage d'Odon.
    en: >-
      One rider is named: Wadard. He is no great lord, yet a man of that name appears in Domesday Book
      as a tenant of Bishop Odo. One more hint that the embroidery was made for Odo's circle.
  sources: [tituli, musset, wilson]
  review_status: unreviewed
  check: >-
    Check Wadard among Odo's tenants in Domesday Book (Open Domesday or the Phillimore edition).
  lang_review: draft

- n: 42
  latin: HIC COQUITUR CARO ET HIC MINISTRAVERUNT MINISTRI
  gloss:
    fr: Ici on cuit la viande, et ici les serviteurs ont servi
    en: Here meat is cooked, and here the servants have served
  title: {fr: Cuisine de campagne, en: Field kitchen}
  place: Hastings
  script:
    fr: >-
      Une cuisine en plein air : viande embrochée, chaudron suspendu au-dessus du feu, pains sortis
      d'un four. Les serviteurs passent les brochettes à travers une table de fortune faite de boucliers.
    en: >-
      An open-air kitchen: meat on spits, a cauldron hanging over the fire, loaves taken from an oven.
      Servants pass the skewers across a makeshift table made of shields.
  sources: [tituli, wilson]
  review_status: unreviewed
  check: >-
    Check the 'table of shields' reading.
  lang_review: draft

- n: 43
  latin: HIC FECERUN[T] PRANDIUM — ET HIC EPISCOPUS CIBU[M] ET POTU[M] BENEDICIT
  gloss:
    fr: Ici ils prirent leur repas — et ici l'évêque bénit la nourriture et la boisson
    en: Here they had their meal — and here the bishop blesses the food and drink
  title: {fr: Le repas béni, en: The blessed meal}
  place: Hastings
  script:
    fr: >-
      Autour d'une table en demi-cercle, l'évêque Odon bénit le repas. La composition rappelle les
      images de la Cène : la conquête est placée sous la protection de Dieu.
    en: >-
      Around a half-moon table, Bishop Odo blesses the meal. The layout recalls pictures of the Last
      Supper: the conquest is placed under God's protection.
  sources: [tituli, wilson, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 44
  latin: ODO EP[ISCOPU]S — WILLELM[US] — ROTBERT
  gloss: {fr: L'évêque Odon — Guillaume — Robert, en: Bishop Odo — William — Robert}
  title: {fr: Le conseil des trois frères, en: The three brothers}
  place: Hastings
  script:
    fr: >-
      Guillaume siège entre ses deux demi-frères : Odon, évêque de Bayeux, et Robert, comte de Mortain.
      C'est Odon qui parle. Dans cette broderie, il n'est jamais un simple figurant.
    en: >-
      William sits between his two half-brothers: Odo, Bishop of Bayeux, and Robert, Count of Mortain.
      Odo is the one speaking. In this embroidery he is never a bystander.
  sources: [tituli, bates, musset]
  review_status: unreviewed
  lang_review: draft

- n: 45
  latin: ISTE IUSSIT UT FODERETUR CASTELLUM AT HESTENGA — CEASTRA
  gloss:
    fr: Celui-ci ordonna qu'on creuse un château à Hastings — camp fortifié
    en: This man ordered a castle to be dug at Hastings — fortified camp
  title: {fr: Le château de Hastings, en: Hastings castle}
  place: Hastings
  script:
    fr: >-
      Des hommes armés de pelles élèvent une motte à Hastings. Le mot « ceastra » est du vieil anglais,
      et « at » remplace le latin « ad » : de petits indices qui font penser à des brodeurs anglais.
    en: >-
      Men with spades throw up a motte at Hastings. The word "ceastra" is Old English, and "at" stands
      in for Latin "ad": small clues that point to English embroiderers.
  sources: [tituli, musset, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 46
  latin: HIC NUNTIATUM EST WILLELM[O] DE HAROLD[O]
  gloss: {fr: Ici on informa Guillaume au sujet d'Harold, en: Here William was told about Harold}
  title: {fr: Nouvelles d'Harold, en: News of Harold}
  place: Hastings
  script:
    fr: >-
      On annonce à Guillaume qu'Harold approche. Le roi anglais vient de vaincre une armée norvégienne
      à Stamford Bridge, le 25 septembre, et redescend vers le sud à marche forcée. La broderie n'en
      dit pas un mot.
    en: >-
      William is told that Harold is coming. The English king has just defeated a Norwegian army at
      Stamford Bridge, on 25 September, and is marching south at speed. The embroidery says not a word
      about it.
  sources: [tituli, asc, morris]
  review_status: unreviewed
  lang_review: draft

- n: 47
  latin: HIC DOMUS INCENDITUR
  gloss: {fr: Ici on incendie une maison, en: Here a house is set on fire}
  title: {fr: La maison incendiée, en: The burning house}
  place: Hastings
  script:
    fr: >-
      Deux soldats mettent le feu à une maison ; une femme en sort en tenant un enfant par la main.
      Une image rare de la guerre vue du côté des civils, au cœur d'un récit de vainqueurs.
    en: >-
      Two soldiers set fire to a house; a woman leads a child out by the hand. A rare picture of war
      seen from the civilians' side, in the middle of a victor's story.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 48
  latin: HIC MILITES EXIERUNT DE HESTENGA ET VENERUNT AD PR[O]ELIUM CONTRA HAROLDUM REGE[M]
  gloss:
    fr: Ici les chevaliers sortirent de Hastings et vinrent au combat contre le roi Harold
    en: Here the knights left Hastings and came to battle against King Harold
  title: {fr: En route vers la bataille, en: To the battle}
  place: Hastings
  script:
    fr: >-
      Le matin du 14 octobre 1066, Guillaume, en armure, reçoit son cheval, et l'armée part au combat.
      Notez la légende : Harold y est appelé « roi ». La broderie ne lui retire jamais ce titre.
    en: >-
      On the morning of 14 October 1066 William, in armour, is brought his horse and the army sets out.
      Note the caption: Harold is called "king". The embroidery never takes that title away from him.
  sources: [tituli, asc, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 49
  latin: HIC WILLELM[US] DUX INTERROGAT VITAL[EM] SI VIDISSET HAROLDI EXERCITU[M]
  gloss:
    fr: Ici le duc Guillaume demande à Vital s'il a vu l'armée d'Harold
    en: Here Duke William asks Vital whether he has seen Harold's army
  title: {fr: Vital l'éclaireur, en: Vital the scout}
  place: Battle
  script:
    fr: >-
      Guillaume interroge Vital, un éclaireur. Comme Wadard, ce Vital porte un nom qu'on retrouve parmi
      les vassaux d'Odon. Les hommes nommés dans la broderie sont presque tous de son entourage.
    en: >-
      William questions Vital, a scout. Like Wadard, Vital bears a name found among Odo's tenants. The
      men named in the embroidery nearly all come from his circle.
  sources: [tituli, musset, wilson]
  review_status: unreviewed
  check: >-
    Check Vital among Odo's tenants in Domesday Book.
  lang_review: draft

- n: 50
  latin: ISTE NUNTIAT HAROLDUM REGE[M] DE EXERCITU WILLELMI DUCIS
  gloss:
    fr: Celui-ci informe le roi Harold de l'armée du duc Guillaume
    en: This man tells King Harold about Duke William's army
  title: {fr: L'éclaireur anglais, en: The English scout}
  place: Battle
  script:
    fr: >-
      En miroir, un éclaireur anglais rapporte à Harold l'approche des Normands.
      Les deux armées se cherchent ; la bataille est imminente.
    en: >-
      As a mirror image, an English scout reports the Normans' approach to Harold. The two
      armies are closing on each other; battle is imminent.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 51
  latin: >-
    HIC WILLELM[US] DUX ALLOQUITUR SUIS MILITIBUS UT PREPARARENT SE VIRILITER ET SAPIENTER AD
    PR[O]ELIUM CONTRA ANGLORUM EXERCITU[M]
  gloss:
    fr: >-
      Ici le duc Guillaume exhorte ses chevaliers à se préparer avec courage et sagesse au combat
      contre l'armée des Anglais
    en: >-
      Here Duke William urges his knights to prepare themselves manfully and wisely for battle against
      the army of the English
  title: {fr: La harangue, en: The address}
  place: Battle
  script:
    fr: >-
      Guillaume harangue ses troupes. Puis la charge : cavaliers lancés au galop, lances brandies,
      tandis que dans la bordure du bas les archers normands tirent leurs flèches.
    en: >-
      William addresses his troops. Then the charge: riders at the gallop, lances raised, while the
      Norman archers loose their arrows in the lower border.
  sources: [tituli, poitiers, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 52
  latin: HIC CECIDERUNT LEWINE ET GYRÐ FRATRES HAROLDI REGIS
  gloss:
    fr: Ici tombèrent Leofwine et Gyrth, frères du roi Harold
    en: Here fell Leofwine and Gyrth, brothers of King Harold
  title: {fr: Les frères d'Harold, en: Harold's brothers}
  place: Battle
  script:
    fr: >-
      Le mur de boucliers anglais tient face aux cavaliers. Mais deux frères d'Harold, Leofwine et
      Gyrth, tombent au combat. Dans la bordure, les morts s'accumulent déjà.
    en: >-
      The English shield wall holds against the horsemen. But two of Harold's brothers, Leofwine and
      Gyrth, are killed. In the border the dead are already piling up.
  sources: [tituli, asc, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 53
  latin: HIC CECIDERUNT SIMUL ANGLI ET FRANCI IN PR[O]ELIO
  gloss:
    fr: Ici tombèrent ensemble Anglais et Français dans la bataille
    en: Here English and French fell together in the battle
  title: {fr: La mêlée, en: The melee}
  place: Battle
  script:
    fr: >-
      Anglais et « Francs » meurent côte à côte. Sur une butte, des fantassins anglais résistent ; des
      chevaux s'effondrent, culbutés, dans un marais. La bataille dure toute la journée.
    en: >-
      English and "French" die side by side. On a hillock English foot soldiers hold out; horses crash
      and tumble in a marshy hollow. The battle lasts all day.
  sources: [tituli, poitiers, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 54
  latin: HIC ODO EP[ISCOPU]S BACULU[M] TENENS CONFORTAT PUEROS
  gloss:
    fr: Ici l'évêque Odon, tenant un bâton, encourage les jeunes gens
    en: Here Bishop Odo, holding a club, encourages the young men
  title: {fr: Odon à la bataille, en: Odo in the battle}
  place: Battle
  script:
    fr: >-
      Odon chevauche au milieu de la mêlée, un bâton à la main, et ranime les jeunes cavaliers qui
      faiblissent. On dit souvent qu'il porte une masse pour ne pas verser le sang en tant que clerc ;
      c'est plutôt un bâton de commandement.
    en: >-
      Odo rides into the fray, club in hand, rallying the young horsemen who are wavering. It is often
      said that he carries a mace so as not to shed blood as a churchman; it is more likely a staff of
      command.
  sources: [tituli, musset, newapproaches]
  review_status: unreviewed
  check: >-
    Find a precise reference for the mace / no-bloodshed myth and its rebuttal.
  lang_review: draft

- n: 55
  latin: HIC EST WILLEL[MUS] DUX — E[USTA]TIUS
  gloss: {fr: Voici le duc Guillaume — Eustache, en: This is Duke William — Eustace}
  title: {fr: Guillaume se montre, en: William shows his face}
  place: Battle
  script:
    fr: >-
      La rumeur court que Guillaume est mort. Il relève son casque pour montrer son visage, pendant
      qu'Eustache de Boulogne le désigne de son étendard. Guillaume de Poitiers raconte la même scène :
      le duc arrête ainsi la panique.
    en: >-
      A rumour spreads that William is dead. He pushes up his helmet to show his face, while Eustace of
      Boulogne points to him with his banner. William of Poitiers tells the same story: this is how the
      duke stopped the panic.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 56
  latin: HIC FRANCI PUGNANT ET CECIDERUNT QUI ERANT CUM HAROLDO
  gloss:
    fr: Ici les Français combattent, et ceux qui étaient avec Harold tombèrent
    en: Here the French fight, and those who were with Harold fell
  title: {fr: La garde d'Harold, en: Harold's guard}
  place: Battle
  script:
    fr: >-
      Les cavaliers normands enfoncent enfin les rangs anglais. Les hommes d'Harold tombent ; en bas, on
      dépouille déjà les morts de leurs cottes de mailles.
    en: >-
      The Norman horsemen finally break into the English ranks. Harold's men fall; below, the dead are
      already being stripped of their mail.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 57
  latin: HIC HAROLD REX INTERFECTUS EST
  gloss: {fr: Ici le roi Harold a été tué, en: Here King Harold was killed}
  title: {fr: La mort d'Harold, en: Harold's death}
  place: Battle
  script:
    fr: >-
      Harold est tué. Mais lequel est-il ? L'homme qui saisit la flèche fichée près de son œil, ou celui
      qui tombe sous l'épée d'un cavalier ? La « flèche dans l'œil » est peut-être en partie l'œuvre
      des restaurateurs. Ouvrez l'encadré pour suivre l'enquête.
    en: >-
      Harold is killed. But which one is he? The man clutching the arrow near his eye, or the one cut
      down by a horseman's sword? The "arrow in the eye" may partly be the restorers' work. Open the
      panel to follow the investigation.
  sources: [tituli, brooks_walker, foys, carmen]
  review_status: unreviewed
  lang_review: draft

- n: 58
  latin: ET FUGA VERTERUNT ANGLI
  gloss: {fr: Et les Anglais prirent la fuite, en: And the English turned to flight}
  title: {fr: La fuite, en: The rout}
  place: Battle
  script:
    fr: >-
      Les Anglais s'enfuient, poursuivis par les cavaliers. Ici la broderie s'interrompt : la fin est
      perdue, et cette dernière légende manque sur les relevés du XVIIIᵉ siècle. On imagine souvent une
      scène finale, Guillaume couronné à Noël 1066. Nous ne la verrons jamais.
    en: >-
      The English flee, chased by the horsemen. Here the embroidery breaks off: the end is lost, and this
      last caption is missing from the eighteenth-century drawings. A final scene is often imagined,
      William crowned at Christmas 1066. We will never see it.
  sources: [tituli, musset, hicks]
  review_status: unreviewed
  lang_review: draft
