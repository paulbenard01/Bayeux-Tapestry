# The 58 scenes of the Bayeux Tapestry, in the numbering inked on the backing cloth around 1800
# and still used by the Bayeux Museum (Musset 2002).
#
# latin:   the titulus as embroidered; [brackets] expand abbreviations.
# gloss:   our own translation of the titulus.
# title:   a short heading for menus.
# script:  the narration (read by a voice, see scripts/narration.py); also the on-screen captions. Own words,
#          plain academic register: describe, cite, flag debates; no rhetorical questions or effects.
# sources: keys in content/sources.yaml backing the facts in the script.
#
# Every text starts as review_status: unreviewed / lang_review: draft (Paul reviews).

- n: 1
  latin: EDWARD[US] REX
  gloss: {fr: Le roi Édouard, en: King Edward}
  title: {fr: Le roi Édouard, en: King Edward}
  script:
    fr: >-
      Le récit s'ouvre dans un palais anglais. Le roi Édouard le Confesseur, âgé et sans héritier,
      s'entretient avec deux hommes, dont l'un est probablement Harold, le comte le plus puissant du royaume.
      La broderie ne dit pas ce qui se dit entre eux. Les chroniqueurs normands affirment qu'Édouard envoie
      Harold confirmer à Guillaume de Normandie la promesse de la couronne.
    en: >-
      The narrative opens in an English palace. King Edward the Confessor, elderly and without an heir, speaks
      with two men, one of whom is probably Harold, the most powerful earl in the kingdom. The embroidery does
      not say what passes between them. The Norman chroniclers state that Edward was sending Harold to confirm
      to William of Normandy the promise of the crown.
  sources: [tituli, poitiers, musset]
  review_status: unreviewed
  lang_review: draft

- n: 2
  latin: UBI HAROLD DUX ANGLORUM ET SUI MILITES EQUITANT AD BOSHAM
  gloss:
    fr: Où Harold, chef des Anglais, et ses hommes chevauchent vers Bosham
    en: Where Harold, leader of the English, and his men ride to Bosham
  title: {fr: Chevauchée vers Bosham, en: The ride to Bosham}
  place: Bosham
  script:
    fr: >-
      Harold part à cheval, un faucon au poing, ses chiens courant devant lui : l'image habituelle d'un
      seigneur en déplacement. Il se rend à Bosham, sur la côte du Sussex, un domaine de sa famille, les
      Godwin.
    en: >-
      Harold rides out with a hawk on his wrist and hounds running ahead, the conventional image of a lord
      travelling. His destination is Bosham, on the Sussex coast, an estate held by his family, the Godwins.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 3
  latin: ECCLESIA[M]
  gloss: {fr: (vers) l'église, en: (to) the church}
  title: {fr: Prière et banquet à Bosham, en: Prayer and feast at Bosham}
  place: Bosham
  script:
    fr: >-
      À Bosham, deux hommes entrent dans l'église pour prier avant la traversée. Suit un repas dans une salle
      à l'étage, cornes à boire en main, jusqu'à ce qu'un personnage, dans l'escalier, signale que le navire
      est prêt.
    en: >-
      At Bosham two men enter the church to pray before the crossing. A meal follows in an upper hall, with
      drinking horns, until a figure on the stairs signals that the ship is ready.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 4
  latin: HIC HAROLD MARE NAVIGAVIT
  gloss: {fr: Ici Harold a pris la mer, en: Here Harold sailed the sea}
  title: {fr: L'embarquement, en: Setting sail}
  script:
    fr: >-
      Les hommes relèvent leurs tuniques et gagnent les navires à pied, en portant les chiens et le faucon.
      Les coques relèvent de la tradition scandinave : une voile carrée unique, une proue et une poupe
      relevées.
    en: >-
      The men lift their tunics and wade out to the ships, carrying the hounds and the hawk. The hulls follow
      the Scandinavian tradition: a single square sail and raised prow and stern.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 5
  latin: ET VELIS VENTO PLENIS VENIT IN TERRA WIDONIS COMITIS
  gloss:
    fr: Et, voiles gonflées par le vent, il arriva sur la terre du comte Guy
    en: And with sails full of wind he came to the land of Count Guy
  title: {fr: Arrivée en Ponthieu, en: Landing in Ponthieu}
  place: Ponthieu
  script:
    fr: >-
      Le navire n'atteint pas la Normandie. Harold aborde en Ponthieu, près de l'embouchure de la Somme, sur
      les terres du comte Guy. Les sources ne permettent pas de dire s'il y a été poussé par le vent ou s'il
      comptait y débarquer.
    en: >-
      The ship does not reach Normandy. Harold lands in Ponthieu, near the mouth of the Somme, on the lands of
      Count Guy. Whether he was driven there by the wind or intended to land there is not settled by the
      sources.
  sources: [tituli, poitiers, morris]
  review_status: unreviewed
  lang_review: draft

- n: 6
  latin: HAROLD
  gloss: {fr: Harold, en: Harold}
  title: {fr: Harold débarque, en: Harold comes ashore}
  place: Ponthieu
  script:
    fr: >-
      Harold met pied à terre. Comme presque tous les Anglais de la broderie, il porte la moustache, alors que
      les Normands ont la nuque rasée. Un guetteur l'a déjà aperçu.
    en: >-
      Harold comes ashore. Like almost all the English in the embroidery he wears a moustache, whereas the
      Normans are shown with the backs of their heads shaved. A lookout has already seen him.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 7
  latin: HIC APPREHENDIT WIDO HAROLDU[M]
  gloss: {fr: Ici Guy s'empare d'Harold, en: Here Guy seizes Harold}
  title: {fr: Harold capturé, en: Harold seized}
  place: Ponthieu
  script:
    fr: >-
      Le comte Guy arrête Harold dès son arrivée. Au onzième siècle, un voyageur de haut rang échoué sur les
      côtes d'un seigneur pouvait être retenu contre rançon, et Harold représentait une prise de grande
      valeur.
    en: >-
      Count Guy arrests Harold on landing. In the eleventh century a high-ranking traveller cast up on a
      lord's coast could be held for ransom, and Harold was a prisoner of considerable value.
  sources: [tituli, poitiers, morris]
  review_status: unreviewed
  lang_review: draft

- n: 8
  latin: ET DUXIT EUM AD BELREM ET IBI EUM TENUIT
  gloss:
    fr: Et il le conduisit à Beaurain et l'y retint
    en: And he took him to Beaurain and held him there
  title: {fr: Retenu à Beaurain, en: Held at Beaurain}
  place: Beaurain
  script:
    fr: >-
      Les deux hommes chevauchent côte à côte vers Beaurain, l'une des places fortes du comte. Harold porte
      toujours son faucon, signe que son rang est reconnu, même en captivité.
    en: >-
      The two men ride side by side to Beaurain, one of the count's strongholds. Harold still carries his
      hawk, a sign that his rank is recognised even in captivity.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 9
  latin: UBI HAROLD ⁊ WIDO PARABOLANT
  gloss: {fr: Où Harold et Guy s'entretiennent, en: Where Harold and Guy talk}
  title: {fr: Harold et Guy, en: Harold and Guy}
  place: Beaurain
  script:
    fr: >-
      Guy, assis, reçoit Harold, debout, l'épée pointée vers le sol. Un personnage écoute derrière une
      colonne. Le signe en forme de sept dans la légende est l'abréviation usuelle de « et » dans les
      manuscrits anglais.
    en: >-
      Guy, seated, receives Harold, who stands with his sword pointing downwards. A figure listens from behind
      a column. The sign resembling a seven in the caption is the usual abbreviation for "and" in English
      manuscripts.
  sources: [tituli, wilson, newapproaches]
  review_status: unreviewed
  check: >-
    Confirm the figure listening behind the column (Wilson's commentary).
  lang_review: draft

- n: 10
  latin: UBI NUNTII WILLELMI DUCIS VENERUNT AD WIDONE[M] — TUROLD
  gloss:
    fr: Où les messagers du duc Guillaume vinrent trouver Guy — Turold
    en: Where Duke William's messengers came to Guy — Turold
  title: {fr: Les messagers de Guillaume, en: William's messengers}
  place: Beaurain
  script:
    fr: >-
      Les envoyés de Guillaume exigent que Harold leur soit remis. À côté d'eux, un petit homme barbu tient
      les chevaux ; la légende le nomme Turold. On ignore pourquoi un palefrenier est ainsi nommé.
    en: >-
      William's envoys demand that Harold be handed over. Beside them a small bearded man holds the horses,
      and the caption names him Turold. Why a groom should be named is not known.
  sources: [tituli, musset, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 11
  latin: NUNTII WILLELMI
  gloss: {fr: Les messagers de Guillaume, en: William's messengers}
  title: {fr: Au galop, en: At the gallop}
  script:
    fr: >-
      Deux messagers chevauchent au galop. À partir d'ici, le récit se lit brièvement de droite à gauche.
    en: >-
      Two messengers ride at a gallop. From this point the narrative briefly runs from right to left.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 12
  latin: HIC VENIT NUNTIUS AD WILGELMUM DUCEM
  gloss: {fr: Ici un messager vient trouver le duc Guillaume, en: Here a messenger comes to Duke William}
  title: {fr: La nouvelle parvient à Guillaume, en: The news reaches William}
  script:
    fr: >-
      Guillaume, duc de Normandie, apparaît ici pour la première fois, assis sur son trône. Un messager
      moustachu, donc sans doute anglais, lui apprend la capture d'Harold. La broderie a montré la conséquence
      avant la cause.
    en: >-
      William, Duke of Normandy, appears here for the first time, seated on his throne. A messenger with a
      moustache, and so presumably English, reports Harold's capture. The embroidery has shown the consequence
      before its cause.
  sources: [tituli, wilson, musset]
  review_status: unreviewed
  check: >-
    Confirm the messenger to William is shown with a moustache (English) and the reverse reading of scenes 10-12.
  lang_review: draft

- n: 13
  latin: HIC WIDO ADDUXIT HAROLDUM AD WILGELMUM NORMANNORUM DUCEM
  gloss:
    fr: Ici Guy conduisit Harold à Guillaume, duc des Normands
    en: Here Guy brought Harold to William, Duke of the Normans
  title: {fr: Harold remis à Guillaume, en: Harold handed to William}
  script:
    fr: >-
      Guy remet son prisonnier à Guillaume. Selon Guillaume de Poitiers, l'échange a lieu à Eu, à la frontière
      normande, et Guy est récompensé. Harold passe de la captivité à une hospitalité qui l'oblige envers le
      duc.
    en: >-
      Guy hands his prisoner over to William. According to William of Poitiers the exchange took place at Eu,
      on the Norman border, and Guy was rewarded. Harold moves from captivity to a hospitality that places him
      under obligation.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 14
  latin: HIC DUX WILGELM[US] CUM HAROLDO VENIT AD PALATIU[M] SUU[M]
  gloss:
    fr: Ici le duc Guillaume vint avec Harold à son palais
    en: Here Duke William came with Harold to his palace
  title: {fr: Au palais du duc, en: At the duke's palace}
  script:
    fr: >-
      Guillaume reçoit Harold dans son palais, probablement à Rouen, siège du pouvoir ducal. Harold parle, la
      main tendue ; des hommes en armes se tiennent derrière lui. Les sources normandes et anglaises divergent
      sur l'objet de cet entretien.
    en: >-
      William receives Harold in his palace, probably at Rouen, the ducal seat. Harold speaks with his hand
      outstretched; armed men stand behind him. The Norman and English sources give different accounts of what
      was discussed.
  sources: [tituli, poitiers, eadmer]
  review_status: unreviewed
  lang_review: draft

- n: 15
  latin: UBI UNUS CLERICUS ET ÆLFGYVA
  gloss: {fr: Où un clerc et Ælfgyva…, en: Where a cleric and Ælfgyva…}
  title: {fr: L'énigme d'Ælfgyva, en: The Ælfgyva riddle}
  script:
    fr: >-
      C'est la scène la plus obscure de la broderie : une femme nommée Ælfgyva, un clerc qui lui touche le
      visage, et une légende sans verbe. Les contemporains connaissaient vraisemblablement l'allusion ; elle
      s'est perdue depuis.
    en: >-
      This is the most obscure scene in the embroidery: a woman named Ælfgyva, a cleric touching her face, and
      a caption without a verb. Contemporary viewers presumably knew the allusion; it has since been lost.
  sources: [tituli, musset, pastan_white]
  review_status: unreviewed
  lang_review: draft

- n: 16
  latin: HIC WILLEM[US] DUX ET EXERCITUS EIUS VENERUNT AD MONTE[M] MICHAELIS
  gloss:
    fr: Ici le duc Guillaume et son armée vinrent au Mont-Saint-Michel
    en: Here Duke William and his army came to Mont Saint-Michel
  title: {fr: Le Mont-Saint-Michel, en: Mont Saint-Michel}
  place: Mont-Saint-Michel
  script:
    fr: >-
      Guillaume fait campagne contre le duc de Bretagne et emmène Harold avec lui. L'armée passe au pied du
      Mont-Saint-Michel, figuré en quelques traits par une église sur son rocher.
    en: >-
      William campaigns against the Duke of Brittany and takes Harold with him. The army passes Mont
      Saint-Michel, rendered in a few lines as a church on its rock.
  sources: [tituli, poitiers, bates]
  review_status: unreviewed
  lang_review: draft

- n: 17
  latin: ET HIC TRANSIERUNT FLUMEN COSNONIS — HIC HAROLD DUX TRAHEBAT EOS DE ARENA
  gloss:
    fr: Et ici ils traversèrent le Couesnon — Ici Harold les tirait des sables
    en: And here they crossed the river Couesnon — Here Harold dragged them from the sand
  title: {fr: Les sables du Couesnon, en: The Couesnon quicksand}
  place: Couesnon
  script:
    fr: >-
      En traversant le Couesnon, des soldats s'enlisent dans les sables de la baie. Harold en dégage deux,
      l'un sur son dos, l'autre par la main. La broderie reconnaît ici le courage d'Harold, comme le fait
      aussi Guillaume de Poitiers.
    en: >-
      Crossing the River Couesnon, soldiers are caught in the quicksand of the bay. Harold pulls out two of
      them, one on his back and one by the hand. Here the embroidery acknowledges Harold's courage, as William
      of Poitiers also does.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 18
  latin: ET VENERUNT AD DOL ET CONAN FUGA VERTIT — REDNES
  gloss:
    fr: Et ils vinrent à Dol, et Conan prit la fuite — Rennes
    en: And they came to Dol, and Conan took flight — Rennes
  title: {fr: Dol et Rennes, en: Dol and Rennes}
  place: Dol-de-Bretagne
  script:
    fr: >-
      À Dol, le duc Conan II de Bretagne s'échappe du château en descendant le long d'une corde. Rennes est
      représentée par un château sur une motte, signe conventionnel de la ville.
    en: >-
      At Dol, Duke Conan the Second of Brittany escapes by climbing down a rope from the castle. Rennes is
      represented by a castle on a mound, a conventional sign for the town.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 19
  latin: HIC MILITES WILLELM[I] DUCIS PUGNANT CONTRA DINANTES
  gloss:
    fr: Ici les chevaliers du duc Guillaume combattent contre les gens de Dinan
    en: Here Duke William's knights fight the men of Dinan
  title: {fr: L'assaut de Dinan, en: The attack on Dinan}
  place: Dinan
  script:
    fr: >-
      Les cavaliers chargent, lance en avant, tandis que deux hommes mettent le feu à la palissade de Dinan.
      C'est l'une des plus anciennes représentations d'un château à motte : une butte de terre surmontée d'une
      tour de bois.
    en: >-
      The horsemen charge with lances while two men set fire to the palisade at Dinan. The scene is one of the
      earliest depictions of a motte castle: an earthen mound topped by a timber tower.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 20
  latin: ET CUNAN CLAVES PORREXIT
  gloss: {fr: Et Conan tendit les clés, en: And Conan handed over the keys}
  title: {fr: Les clés de Dinan, en: The keys of Dinan}
  place: Dinan
  script:
    fr: >-
      Conan se rend en tendant les clés de la ville au bout de sa lance, et Guillaume les reçoit de la même
      manière. Le geste signifie sans ambiguïté la soumission.
    en: >-
      Conan surrenders, passing the keys of the town on the end of his lance, and William receives them in the
      same way. The gesture is an unambiguous sign of submission.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 21
  latin: HIC WILLELM[US] DEDIT HAROLDO ARMA
  gloss: {fr: Ici Guillaume donna des armes à Harold, en: Here William gave Harold arms}
  title: {fr: Harold reçoit des armes, en: Harold receives arms}
  script:
    fr: >-
      Guillaume remet à Harold un casque et des armes. Beaucoup d'historiens y voient plus qu'un don : une
      cérémonie qui fait d'Harold l'homme de Guillaume, lié à lui par la fidélité.
    en: >-
      William gives Harold a helmet and arms. Many historians read this as more than a gift: a ceremony that
      made Harold William's man, bound to him by fealty.
  sources: [tituli, poitiers, bates]
  review_status: unreviewed
  lang_review: draft

- n: 22
  latin: HIC WILLELM[US] VENIT BAGIAS
  gloss: {fr: Ici Guillaume vint à Bayeux, en: Here William came to Bayeux}
  title: {fr: Arrivée à Bayeux, en: Arrival at Bayeux}
  place: Bayeux
  script:
    fr: >-
      Guillaume arrive à Bayeux, où la broderie sera plus tard exposée, dans la cathédrale de l'évêque Odon,
      demi-frère du duc. Le choix de situer la scène suivante à Bayeux n'est sans doute pas fortuit.
    en: >-
      William arrives at Bayeux, where the embroidery was later displayed, in the cathedral of Bishop Odo, the
      duke's half-brother. The placing of the following scene in Bayeux is unlikely to be accidental.
  sources: [tituli, musset, bouet]
  review_status: unreviewed
  lang_review: draft

- n: 23
  latin: UBI HAROLD SACRAMENTUM FECIT WILLELMO DUCI
  gloss: {fr: Où Harold prêta serment au duc Guillaume, en: Where Harold swore an oath to Duke William}
  title: {fr: Le serment, en: The oath}
  place: Bayeux
  script:
    fr: >-
      C'est l'épisode central du récit. Les mains posées sur deux reliquaires, Harold prête serment devant
      Guillaume. La broderie n'en précise pas le contenu. Dans la lecture normande, en acceptant plus tard la
      couronne, Harold devient parjure.
    en: >-
      This is the central episode of the narrative. With his hands on two reliquaries, Harold swears an oath
      before William. The embroidery does not state its content. In the Norman interpretation, Harold's later
      acceptance of the crown made him an oath-breaker.
  sources: [tituli, poitiers, eadmer, bates]
  review_status: unreviewed
  lang_review: draft

- n: 24
  latin: HIC HAROLD DUX REVERSUS EST AD ANGLICAM TERRAM
  gloss: {fr: Ici Harold revint en terre anglaise, en: Here Harold returned to England}
  title: {fr: Le retour, en: The return}
  script:
    fr: >-
      Harold rentre en Angleterre par la mer. Sur la côte, un personnage à une fenêtre observe l'arrivée du
      navire.
    en: >-
      Harold returns to England by sea. On the coast a figure at a window watches the ship approach.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 25
  latin: ET VENIT AD EDWARDU[M] REGEM
  gloss: {fr: Et il vint trouver le roi Édouard, en: And he came to King Edward}
  title: {fr: Devant Édouard, en: Before Edward}
  script:
    fr: >-
      Harold se présente devant Édouard, la tête légèrement inclinée. Le roi, représenté plus âgé, tend le
      doigt vers lui. Le geste peut se lire comme un reproche ou comme un accueil, et chaque interprétation
      dépend de la lecture d'ensemble que l'on retient.
    en: >-
      Harold comes before Edward with his head slightly bowed. The king is shown as older and points towards
      him. The gesture can be read as a reproach or as a greeting, and interpretations tend to follow each
      reader's view of the wider story.
  sources: [tituli, wilson, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 26
  latin: HIC PORTATUR CORPUS EADWARDI REGIS AD ECCLESIAM S[AN]C[T]I PETRI AP[OSTO]LI
  gloss:
    fr: Ici le corps du roi Édouard est porté à l'église de saint Pierre apôtre
    en: Here King Edward's body is carried to the church of Saint Peter the Apostle
  title: {fr: Les funérailles d'Édouard, en: Edward's funeral}
  place: Westminster
  script:
    fr: >-
      Le corps d'Édouard est porté à l'église Saint-Pierre, l'abbaye de Westminster qu'il avait fondée et qui
      venait d'être consacrée. Un homme fixe un coq sur le toit, et la main de Dieu apparaît au-dessus. Les
      funérailles sont montrées avant la mort du roi.
    en: >-
      Edward's body is carried to the church of Saint Peter, the abbey at Westminster that he had founded and
      which had just been consecrated. A man is fixing a weathercock to the roof, and the hand of God appears
      above. The funeral is shown before the king's death.
  sources: [tituli, vita, asc, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 27
  latin: HIC EADWARDUS REX IN LECTO ALLOQUIT[UR] FIDELES
  gloss:
    fr: Ici le roi Édouard, dans son lit, parle à ses fidèles
    en: Here King Edward, in bed, speaks to his faithful men
  title: {fr: Le lit de mort, en: The deathbed}
  place: Westminster
  script:
    fr: >-
      Le récit revient ici en arrière. Dans une chambre à l'étage, Édouard mourant s'adresse à son entourage,
      et un homme tend la main vers la sienne. Selon la Vie du roi Édouard, il confie alors le royaume à la
      protection d'Harold. Garde ou succession : c'est le point central du débat.
    en: >-
      The narrative now moves back in time. In an upper chamber the dying Edward addresses those around him,
      and one man reaches towards his hand. According to the Life of King Edward, he commended the kingdom to
      Harold's protection. Whether this meant guardianship or succession is the central point of debate.
  sources: [tituli, vita, asc, morris]
  review_status: unreviewed
  lang_review: draft

- n: 28
  latin: ET HIC DEFUNCTUS EST
  gloss: {fr: Et ici il mourut, en: And here he died}
  title: {fr: La mort d'Édouard, en: Edward dies}
  place: Westminster
  script:
    fr: >-
      En dessous, on prépare le corps pour l'ensevelissement. Édouard meurt le 5 janvier 1066. En plaçant les
      funérailles avant la mort, le concepteur fait de ce moment le pivot du récit.
    en: >-
      Below, the body is prepared for burial. Edward died on the fifth of January 1066. By placing the funeral
      before the death, the designer makes this moment the hinge of the narrative.
  sources: [tituli, asc, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 29
  latin: HIC DEDERUNT HAROLDO CORONA[M] REGIS
  gloss: {fr: Ici ils donnèrent à Harold la couronne royale, en: Here they gave Harold the king's crown}
  title: {fr: La couronne offerte, en: The crown offered}
  script:
    fr: >-
      Deux hommes présentent à Harold la couronne et une hache. La légende dit seulement « ils », sans nommer
      ceux qui la lui offrent, ce qui laisse ouverte la question de la légitimité de ce choix.
    en: >-
      Two men present Harold with the crown and an axe. The caption says only "they", without naming those who
      offered it, which leaves the legitimacy of the choice open.
  sources: [tituli, wilson, pastan_white]
  review_status: unreviewed
  lang_review: draft

- n: 30
  latin: HIC RESIDET HAROLD REX ANGLORUM
  gloss: {fr: "Ici siège Harold, roi des Anglais", en: "Here sits Harold, King of the English"}
  title: {fr: Harold roi, en: Harold enthroned}
  place: Westminster
  script:
    fr: >-
      Harold trône, couronné, le sceptre et le globe en main. Selon la Chronique anglo-saxonne, il est sacré
      le 6 janvier 1066, le jour des obsèques d'Édouard, ce qui témoigne de l'urgence à occuper le trône.
    en: >-
      Harold is enthroned, crowned, holding a sceptre and an orb. According to the Anglo-Saxon Chronicle he
      was consecrated on the sixth of January 1066, the day of Edward's burial, which suggests the urgency of
      filling the throne.
  sources: [tituli, asc]
  review_status: unreviewed
  lang_review: draft

- n: 31
  latin: STIGANT ARCHIEP[ISCOPU]S
  gloss: {fr: L'archevêque Stigand, en: Archbishop Stigand}
  title: {fr: Stigand, en: Stigand}
  script:
    fr: >-
      À côté du roi se tient Stigand, archevêque de Cantorbéry, dont la position n'était pas reconnue par la
      papauté. Sa présence n'est pas anodine, car d'autres sources indiquent qu'Harold fut couronné par
      Ealdred, archevêque d'York.
    en: >-
      Beside the king stands Stigand, Archbishop of Canterbury, whose position was not recognised by the
      papacy. His presence here is significant, since other sources state that Harold was crowned by Ealdred,
      Archbishop of York.
  sources: [tituli, john_worcester, morris]
  review_status: unreviewed
  lang_review: draft

- n: 32
  latin: ISTI MIRANT[UR] STELLA[M]
  gloss: {fr: Ceux-ci admirent l'étoile, en: These men marvel at the star}
  title: {fr: L'étoile, en: The star}
  script:
    fr: >-
      Des hommes lèvent les yeux vers une étoile à la traînée lumineuse : la comète de Halley, visible au
      printemps 1066. La Chronique anglo-saxonne note son apparition le 24 avril et précise qu'elle brilla une
      semaine. On y voyait communément un présage.
    en: >-
      Men look up at a star with a trail of light: Halley's comet, visible in the spring of 1066. The
      Anglo-Saxon Chronicle records its appearance on the twenty-fourth of April and says that it shone for a
      week. It was widely read as an omen.
  sources: [tituli, asc, esa_comet]
  review_status: unreviewed
  lang_review: draft

- n: 33
  latin: HAROLD
  gloss: {fr: Harold, en: Harold}
  title: {fr: Harold inquiet, en: Harold uneasy}
  script:
    fr: >-
      Harold, sur son trône, se penche vers un messager. Dans la bordure inférieure, des navires vides à peine
      esquissés sont souvent interprétés comme la flotte d'invasion qu'il redoute.
    en: >-
      Harold, enthroned, leans towards a messenger. In the lower border below are faint outlines of empty
      ships, often interpreted as the invasion fleet he anticipates.
  sources: [tituli, wilson, owencrocker2005]
  review_status: unreviewed
  lang_review: draft

- n: 34
  latin: HIC NAVIS ANGLICA VENIT IN TERRAM WILLELMI DUCIS
  gloss:
    fr: Ici un navire anglais vint sur la terre du duc Guillaume
    en: Here an English ship came to Duke William's land
  title: {fr: La nouvelle traverse la mer, en: The news crosses the sea}
  script:
    fr: >-
      Un navire anglais traverse la Manche et apporte en Normandie la nouvelle du couronnement d'Harold. La
      rupture entre les deux hommes est désormais ouverte.
    en: >-
      An English ship crosses the Channel and brings news of Harold's coronation to Normandy. This marks the
      open break between the two men.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 35
  latin: HIC WILLELM[US] DUX IUSSIT NAVES EDIFICARE
  gloss: {fr: Ici le duc Guillaume ordonna de construire des navires, en: Here Duke William ordered ships to be built}
  title: {fr: Construire une flotte, en: Building a fleet}
  script:
    fr: >-
      Guillaume, conseillé par un personnage tonsuré souvent identifié comme Odon, ordonne la construction
      d'une flotte. Des bûcherons abattent les arbres, des charpentiers façonnent les planches à la hache et à
      l'herminette.
    en: >-
      William, advised by a tonsured figure often identified as Odo, orders the building of a fleet.
      Woodcutters fell trees and shipwrights shape the planks with axes and adzes.
  sources: [tituli, wilson, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 36
  latin: HIC TRAHUNT NAVES AD MARE
  gloss: {fr: Ici on tire les navires vers la mer, en: Here the ships are dragged to the sea}
  title: {fr: À la mer, en: To the sea}
  script:
    fr: >-
      Les navires achevés sont tirés jusqu'à l'eau avec des cordes. Selon Guillaume de Poitiers, la flotte se
      rassemble à l'embouchure de la Dives au cours de l'été 1066.
    en: >-
      The completed ships are hauled down to the water with ropes. According to William of Poitiers, the fleet
      assembled at the mouth of the Dives during the summer of 1066.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 37
  latin: ISTI PORTANT ARMAS AD NAVES ET HIC TRAHUNT CARRUM CUM VINO ET ARMIS
  gloss:
    fr: Ceux-ci portent des armes aux navires, et ici on tire une charrette de vin et d'armes
    en: These men carry arms to the ships, and here they pull a cart of wine and arms
  title: {fr: Armes et vin, en: Arms and wine}
  script:
    fr: >-
      La scène montre la logistique de l'invasion : des cottes de mailles portées à deux sur une perche en
      raison de leur poids, des casques, des épées et des lances, et une charrette chargée d'un tonneau de
      vin.
    en: >-
      The scene shows the logistics of the invasion: mail shirts carried on poles between two men because of
      their weight, helmets, swords and spears, and a cart with a barrel of wine.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 38
  latin: HIC WILLELM[US] DUX IN MAGNO NAVIGIO MARE TRANSIVIT ET VENIT AD PEVENESÆ
  gloss:
    fr: Ici le duc Guillaume traversa la mer sur un grand navire et vint à Pevensey
    en: Here Duke William crossed the sea in a great ship and came to Pevensey
  title: {fr: La traversée, en: The crossing}
  place: Pevensey
  script:
    fr: >-
      La flotte traverse de nuit, chevaux à bord ; le navire de Guillaume porte une croix en tête de mât. Les
      Normands débarquent sans opposition à Pevensey, sur la côte du Sussex, le 28 septembre 1066, alors
      qu'Harold se trouve dans le nord.
    en: >-
      The fleet crosses by night with horses on board; William's ship carries a cross at the masthead. The
      Normans landed unopposed at Pevensey, on the Sussex coast, on the twenty-eighth of September 1066, while
      Harold was in the north.
  sources: [tituli, poitiers, asc, bates]
  review_status: unreviewed
  lang_review: draft

- n: 39
  latin: HIC EXEUNT CABALLI DE NAVIBUS
  gloss: {fr: Ici les chevaux sortent des navires, en: Here the horses come out of the ships}
  title: {fr: Le débarquement, en: Landing}
  place: Pevensey
  script:
    fr: >-
      On débarque les chevaux, puis les navires sont tirés sur la plage, mâts abaissés. La cavalerie tient une
      place centrale dans la stratégie de Guillaume, et son transport à travers la Manche représentait une
      entreprise considérable.
    en: >-
      The horses are unloaded and the ships drawn up on the beach with their masts lowered. Cavalry was
      central to William's strategy, and transporting it across the Channel was a considerable undertaking.
  sources: [tituli, wilson, morris]
  review_status: unreviewed
  lang_review: draft

- n: 40
  latin: ET HIC MILITES FESTINAVERUNT HESTINGA UT CIBUM RAPERENTUR
  gloss:
    fr: Et ici les chevaliers se hâtèrent vers Hastings pour s'emparer de vivres
    en: And here the knights hurried to Hastings to seize food
  title: {fr: Le fourrage, en: Foraging}
  place: Hastings
  script:
    fr: >-
      Des cavaliers se rendent à Hastings pour réquisitionner des vivres, et d'autres emportent un mouton, un
      bœuf et un porc. L'armée se ravitaille sur le pays qu'elle occupe.
    en: >-
      Mounted men ride to Hastings to requisition supplies, and others carry off a sheep, an ox and a pig. The
      army supplies itself from the land it occupies.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 41
  latin: HIC EST WADARD
  gloss: {fr: Voici Wadard, en: This is Wadard}
  title: {fr: Wadard, en: Wadard}
  place: Hastings
  script:
    fr: >-
      Un cavalier est nommé : Wadard. Ce n'est pas un grand seigneur, mais un homme de ce nom figure dans le
      Domesday Book comme tenancier de l'évêque Odon. C'est l'un des indices qui rattachent la broderie à
      l'entourage d'Odon.
    en: >-
      One rider is named: Wadard. He is not a major lord, but a man of that name appears in Domesday Book as a
      tenant of Bishop Odo. This is one of several indications that the embroidery was made for Odo's circle.
  sources: [tituli, musset, wilson]
  review_status: unreviewed
  check: >-
    Check Wadard among Odo's tenants in Domesday Book (Open Domesday or the Phillimore edition).
  lang_review: draft

- n: 42
  latin: HIC COQUITUR CARO ET HIC MINISTRAVERUNT MINISTRI
  gloss:
    fr: Ici on cuit la viande, et ici les serviteurs ont servi
    en: Here meat is cooked, and here the servants have served
  title: {fr: Cuisine de campagne, en: Field kitchen}
  place: Hastings
  script:
    fr: >-
      Une cuisine de campagne : viande à la broche, chaudron sur le feu, pains sortis d'un four. Des
      serviteurs passent les brochettes par-dessus une table improvisée avec des boucliers.
    en: >-
      A field kitchen: meat on spits, a cauldron over the fire, and bread taken from an oven. Servants pass
      the skewers across a table improvised from shields.
  sources: [tituli, wilson]
  review_status: unreviewed
  check: >-
    Check the 'table of shields' reading.
  lang_review: draft

- n: 43
  latin: HIC FECERUN[T] PRANDIUM — ET HIC EPISCOPUS CIBU[M] ET POTU[M] BENEDICIT
  gloss:
    fr: Ici ils prirent leur repas — et ici l'évêque bénit la nourriture et la boisson
    en: Here they had their meal — and here the bishop blesses the food and drink
  title: {fr: Le repas béni, en: The blessed meal}
  place: Hastings
  script:
    fr: >-
      L'évêque Odon bénit le repas autour d'une table en demi-cercle. La composition rappelle les
      représentations de la Cène et place l'expédition sous la protection divine.
    en: >-
      Bishop Odo blesses the meal at a semicircular table. The composition recalls images of the Last Supper
      and places the expedition under divine protection.
  sources: [tituli, wilson, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 44
  latin: ODO EP[ISCOPU]S — WILLELM[US] — ROTBERT
  gloss: {fr: L'évêque Odon — Guillaume — Robert, en: Bishop Odo — William — Robert}
  title: {fr: Le conseil des trois frères, en: The three brothers}
  place: Hastings
  script:
    fr: >-
      Guillaume siège entre ses deux demi-frères, Odon, évêque de Bayeux, et Robert, comte de Mortain. C'est
      Odon qui parle ; tout au long de la broderie, il occupe une place de premier plan.
    en: >-
      William sits between his two half-brothers, Odo, Bishop of Bayeux, and Robert, Count of Mortain. Odo is
      the one speaking, and throughout the embroidery he is given a prominent role.
  sources: [tituli, bates, musset]
  review_status: unreviewed
  lang_review: draft

- n: 45
  latin: ISTE IUSSIT UT FODERETUR CASTELLUM AT HESTENGA — CEASTRA
  gloss:
    fr: Celui-ci ordonna qu'on creuse un château à Hastings — camp fortifié
    en: This man ordered a castle to be dug at Hastings — fortified camp
  title: {fr: Le château de Hastings, en: Hastings castle}
  place: Hastings
  script:
    fr: >-
      Des hommes armés de pelles élèvent une motte à Hastings. Le mot « ceastra » est du vieil anglais, et «
      at » remplace le latin « ad ». Ces détails comptent parmi les arguments en faveur de brodeurs anglais.
    en: >-
      Men with spades raise a motte at Hastings. The word "ceastra" is Old English, and "at" replaces the
      Latin "ad". Such details are among the arguments for English embroiderers.
  sources: [tituli, musset, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 46
  latin: HIC NUNTIATUM EST WILLELM[O] DE HAROLD[O]
  gloss: {fr: Ici on informa Guillaume au sujet d'Harold, en: Here William was told about Harold}
  title: {fr: Nouvelles d'Harold, en: News of Harold}
  place: Hastings
  script:
    fr: >-
      On informe Guillaume de l'approche d'Harold. Le roi anglais venait de vaincre une armée norvégienne à
      Stamford Bridge le 25 septembre et redescendait vers le sud. La broderie ne mentionne pas cette
      campagne.
    en: >-
      William is informed of Harold's approach. The English king had defeated a Norwegian army at Stamford
      Bridge on the twenty-fifth of September and was marching south. The embroidery does not mention this
      campaign.
  sources: [tituli, asc, morris]
  review_status: unreviewed
  lang_review: draft

- n: 47
  latin: HIC DOMUS INCENDITUR
  gloss: {fr: Ici on incendie une maison, en: Here a house is set on fire}
  title: {fr: La maison incendiée, en: The burning house}
  place: Hastings
  script:
    fr: >-
      Deux soldats mettent le feu à une maison, d'où une femme sort en tenant un enfant par la main. C'est une
      représentation rare des effets de la guerre sur les civils, dans un récit construit du point de vue des
      vainqueurs.
    en: >-
      Two soldiers set fire to a house while a woman leads a child out by the hand. It is a rare depiction of
      the effect of war on civilians within a narrative told from the victors' side.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 48
  latin: HIC MILITES EXIERUNT DE HESTENGA ET VENERUNT AD PR[O]ELIUM CONTRA HAROLDUM REGE[M]
  gloss:
    fr: Ici les chevaliers sortirent de Hastings et vinrent au combat contre le roi Harold
    en: Here the knights left Hastings and came to battle against King Harold
  title: {fr: En route vers la bataille, en: To the battle}
  place: Hastings
  script:
    fr: >-
      Le matin du 14 octobre 1066, on amène son cheval à Guillaume, en armure, et l'armée se met en marche. La
      légende désigne Harold comme « roi », titre que la broderie ne lui retire jamais.
    en: >-
      On the morning of the fourteenth of October 1066, William, in armour, is brought his horse and the army
      sets out. The caption calls Harold "king", a title the embroidery never withholds from him.
  sources: [tituli, asc, newapproaches]
  review_status: unreviewed
  lang_review: draft

- n: 49
  latin: HIC WILLELM[US] DUX INTERROGAT VITAL[EM] SI VIDISSET HAROLDI EXERCITU[M]
  gloss:
    fr: Ici le duc Guillaume demande à Vital s'il a vu l'armée d'Harold
    en: Here Duke William asks Vital whether he has seen Harold's army
  title: {fr: Vital l'éclaireur, en: Vital the scout}
  place: Battle
  script:
    fr: >-
      Guillaume interroge Vital, un éclaireur. Comme Wadard, Vital porte un nom attesté parmi les tenanciers
      d'Odon ; la plupart des personnages nommés dans la broderie appartiennent à son entourage.
    en: >-
      William questions Vital, a scout. Like Wadard, Vital bears a name found among Odo's tenants; most of the
      individuals named in the embroidery belong to his circle.
  sources: [tituli, musset, wilson]
  review_status: unreviewed
  check: >-
    Check Vital among Odo's tenants in Domesday Book.
  lang_review: draft

- n: 50
  latin: ISTE NUNTIAT HAROLDUM REGE[M] DE EXERCITU WILLELMI DUCIS
  gloss:
    fr: Celui-ci informe le roi Harold de l'armée du duc Guillaume
    en: This man tells King Harold about Duke William's army
  title: {fr: L'éclaireur anglais, en: The English scout}
  place: Battle
  script:
    fr: >-
      Dans une scène parallèle, un éclaireur anglais informe Harold de l'avance normande. Les deux armées sont
      désormais proches de l'affrontement.
    en: >-
      In a parallel scene, an English scout reports the Norman advance to Harold. The two armies are now close
      to engagement.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 51
  latin: >-
    HIC WILLELM[US] DUX ALLOQUITUR SUIS MILITIBUS UT PREPARARENT SE VIRILITER ET SAPIENTER AD
    PR[O]ELIUM CONTRA ANGLORUM EXERCITU[M]
  gloss:
    fr: >-
      Ici le duc Guillaume exhorte ses chevaliers à se préparer avec courage et sagesse au combat
      contre l'armée des Anglais
    en: >-
      Here Duke William urges his knights to prepare themselves manfully and wisely for battle against
      the army of the English
  title: {fr: La harangue, en: The address}
  place: Battle
  script:
    fr: >-
      Guillaume s'adresse à ses troupes. Vient ensuite la charge : des cavaliers au galop, lances levées,
      tandis que des archers normands tirent depuis la bordure inférieure.
    en: >-
      William addresses his troops. The charge follows: horsemen at the gallop with raised lances, while
      Norman archers shoot from the lower border.
  sources: [tituli, poitiers, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 52
  latin: HIC CECIDERUNT LEWINE ET GYRÐ FRATRES HAROLDI REGIS
  gloss:
    fr: Ici tombèrent Leofwine et Gyrth, frères du roi Harold
    en: Here fell Leofwine and Gyrth, brothers of King Harold
  title: {fr: Les frères d'Harold, en: Harold's brothers}
  place: Battle
  script:
    fr: >-
      Le mur de boucliers anglais résiste à la cavalerie. Deux frères d'Harold, Leofwine et Gyrth, sont tués.
      Dans la bordure inférieure, les morts commencent à s'accumuler.
    en: >-
      The English shield wall holds against the cavalry. Two of Harold's brothers, Leofwine and Gyrth, are
      killed. In the lower border the dead begin to accumulate.
  sources: [tituli, asc, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 53
  latin: HIC CECIDERUNT SIMUL ANGLI ET FRANCI IN PR[O]ELIO
  gloss:
    fr: Ici tombèrent ensemble Anglais et Français dans la bataille
    en: Here English and French fell together in the battle
  title: {fr: La mêlée, en: The melee}
  place: Battle
  script:
    fr: >-
      Anglais et Francs tombent ensemble. Des fantassins anglais tiennent une butte, et des chevaux
      s'effondrent dans un creux marécageux. La bataille dura toute la journée.
    en: >-
      English and French fall together. English foot soldiers hold a hillock, and horses fall in a marshy
      hollow. The battle lasted the whole day.
  sources: [tituli, poitiers, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 54
  latin: HIC ODO EP[ISCOPU]S BACULU[M] TENENS CONFORTAT PUEROS
  gloss:
    fr: Ici l'évêque Odon, tenant un bâton, encourage les jeunes gens
    en: Here Bishop Odo, holding a club, encourages the young men
  title: {fr: Odon à la bataille, en: Odo in the battle}
  place: Battle
  script:
    fr: >-
      Odon chevauche parmi les combattants, un bâton à la main, et rallie les jeunes cavaliers. On dit souvent
      qu'en homme d'Église il portait une masse pour ne pas verser le sang ; il s'agit plus probablement d'un
      bâton de commandement.
    en: >-
      Odo rides among the combatants holding a club and rallies the young horsemen. It is often said that, as
      a churchman, he carried a mace to avoid shedding blood; it is more probably a staff of command.
  sources: [tituli, musset, newapproaches]
  review_status: unreviewed
  check: >-
    Find a precise reference for the mace / no-bloodshed myth and its rebuttal.
  lang_review: draft

- n: 55
  latin: HIC EST WILLEL[MUS] DUX — E[USTA]TIUS
  gloss: {fr: Voici le duc Guillaume — Eustache, en: This is Duke William — Eustace}
  title: {fr: Guillaume se montre, en: William shows his face}
  place: Battle
  script:
    fr: >-
      Le bruit court que Guillaume a été tué. Il relève son casque pour montrer son visage, tandis qu'Eustache
      de Boulogne le désigne de son étendard. Guillaume de Poitiers décrit le même épisode comme le moyen par
      lequel le duc enraya la panique.
    en: >-
      A rumour spreads that William has been killed. He lifts his helmet to show his face, while Eustace of
      Boulogne points to him with a banner. William of Poitiers describes the same episode as the means by
      which the duke checked the panic.
  sources: [tituli, poitiers]
  review_status: unreviewed
  lang_review: draft

- n: 56
  latin: HIC FRANCI PUGNANT ET CECIDERUNT QUI ERANT CUM HAROLDO
  gloss:
    fr: Ici les Français combattent, et ceux qui étaient avec Harold tombèrent
    en: Here the French fight, and those who were with Harold fell
  title: {fr: La garde d'Harold, en: Harold's guard}
  place: Battle
  script:
    fr: >-
      Les cavaliers normands percent enfin les rangs anglais. Les compagnons d'Harold tombent, et dans la
      bordure inférieure on dépouille les morts de leurs cottes de mailles.
    en: >-
      The Norman horsemen finally break into the English ranks. Harold's companions fall, and in the lower
      border the dead are stripped of their mail.
  sources: [tituli, wilson]
  review_status: unreviewed
  lang_review: draft

- n: 57
  latin: HIC HAROLD REX INTERFECTUS EST
  gloss: {fr: Ici le roi Harold a été tué, en: Here King Harold was killed}
  title: {fr: La mort d'Harold, en: Harold's death}
  place: Battle
  script:
    fr: >-
      Harold est tué. On ne sait pas avec certitude quel personnage le représente : l'homme qui saisit une
      flèche près de son œil, ou celui qu'abat l'épée d'un cavalier. La flèche pourrait résulter en partie de
      restaurations ultérieures. L'encadré ci-dessous présente les éléments du dossier.
    en: >-
      Harold is killed. It is not certain which figure represents him: the man grasping an arrow near his eye,
      or the one struck down by a horseman's sword. The arrow may be, in part, the result of later
      restoration. The panel below sets out the evidence.
  sources: [tituli, brooks_walker, foys, carmen]
  review_status: unreviewed
  lang_review: draft

- n: 58
  latin: ET FUGA VERTERUNT ANGLI
  gloss: {fr: Et les Anglais prirent la fuite, en: And the English turned to flight}
  title: {fr: La fuite, en: The rout}
  place: Battle
  script:
    fr: >-
      Les Anglais s'enfuient, poursuivis par la cavalerie. La broderie s'interrompt ici ; sa fin est perdue,
      et cette dernière légende n'apparaît pas sur les relevés du dix-huitième siècle. On a souvent supposé
      une scène finale montrant le couronnement de Guillaume à Noël 1066, mais rien ne permet de le vérifier.
    en: >-
      The English flee, pursued by the cavalry. The embroidery breaks off here; its ending is lost, and this
      final caption does not appear in the eighteenth-century drawings. A closing scene showing William's
      coronation at Christmas 1066 has often been proposed, but it cannot be verified.
  sources: [tituli, musset, hicks]
  review_status: unreviewed
  lang_review: draft
